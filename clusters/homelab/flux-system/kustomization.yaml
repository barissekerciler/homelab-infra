apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
# Requests sized from two days of usage on this cluster (p95 plus headroom);
# the bootstrap defaults reserved 100m per controller. flux bootstrap keeps patches.
patches:
- target:
    kind: Deployment
    name: kustomize-controller
  patch: |
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests
      value: {cpu: 75m, memory: 128Mi}
- target:
    kind: Deployment
    name: image-reflector-controller
  patch: |
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests
      value: {cpu: 50m, memory: 192Mi}
- target:
    kind: Deployment
    name: helm-controller
  patch: |
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests
      value: {cpu: 20m, memory: 96Mi}
- target:
    kind: Deployment
    name: source-controller
  patch: |
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests
      value: {cpu: 20m, memory: 64Mi}
- target:
    kind: Deployment
    name: (notification-controller|image-automation-controller)
  patch: |
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests
      value: {cpu: 10m, memory: 64Mi}
