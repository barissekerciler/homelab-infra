# Flux tenants (tenants/): their namespaces, ServiceAccounts, Git sources and
# Kustomizations. Their Git credentials are ExternalSecrets, and their apps
# build on the platform's apps, hence after infrastructure.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenants
  namespace: flux-system
spec:
  interval: 2m
  retryInterval: 10s
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./tenants
  prune: true
