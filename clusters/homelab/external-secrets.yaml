# External Secrets Operator and its CRDs, before cert-issuers and
# infrastructure apply ExternalSecrets (wait: Ready only once the chart, and
# with it the CRDs, is installed).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: sources
  interval: 2m
  retryInterval: 10s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/external-secrets/controller
  prune: true
  wait: true
