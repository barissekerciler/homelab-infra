# Values: OpenBao secret/homelab-private/git-ssh (KV v2).
# The tenant repository's deploy key (write access: its image automation pushes
# tag updates) and GitHub's host keys, in the layout Flux expects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: git-ssh
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: git-ssh
  data:
    - secretKey: identity
      remoteRef:
        key: homelab-private/git-ssh
        property: identity
    - secretKey: identity.pub
      remoteRef:
        key: homelab-private/git-ssh
        property: identity.pub
    - secretKey: known_hosts
      remoteRef:
        key: homelab-private/git-ssh
        property: known_hosts
