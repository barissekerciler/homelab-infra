# Talos Image Factory schematic for every node. Its ID goes into
# the installer image in talos/README.md; recompute it after any change with
#   curl -X POST --data-binary @talos/schematic.yaml https://factory.talos.dev/schematics
customization:
  systemExtensions:
    officialExtensions:
      # Intel iGPU (Frigate detection, Jellyfin transcoding) and CPU microcode.
      - siderolabs/i915
      - siderolabs/intel-ucode
      # democratic-csi iSCSI volumes on TrueNAS.
      - siderolabs/iscsi-tools
      - siderolabs/util-linux-tools
      - siderolabs/tailscale
