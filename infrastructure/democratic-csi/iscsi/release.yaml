apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi-iscsi
spec:
  releaseName: democratic-csi-iscsi
  chart:
    spec:
      chart: democratic-csi
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
        namespace: flux-system
      # https://github.com/democratic-csi/charts/blob/democratic-csi-0.15.1/stable/democratic-csi/values.yaml
      version: 0.15.1
  interval: 1h0m0s
  values:
    controller:
      # Keep the existing pod checksum.
      podAnnotations:
        checksum/secret: 551a902ead842ced204493407556d794cd6056db472356fd1439089592d6705e
      hostAliases: '[{"ip":"10.0.0.203","hostnames":["nas.home.bariss.dev"]}]'
      driver:
        enabled: true
        image:
          registry: ghcr.io/democratic-csi/democratic-csi
          # Stable release for TrueNAS 25.x. Newer builds need TrueNAS 27.
          tag: v1.9.5@sha256:fc3b7d7ed3a616714139525075312758e23a5d425ffb539ad12c9bd20fb6001f
        resources:
          requests:
            cpu: 10m
          limits:
            cpu: 500m
      externalAttacher:
        resources:
          requests:
            cpu: 5m
          limits:
            cpu: 200m
      externalProvisioner:
        resources:
          requests:
            cpu: 5m
          limits:
            cpu: 200m
      externalResizer:
        resources:
          requests:
            cpu: 5m
          limits:
            cpu: 200m
      externalSnapshotter:
        resources:
          requests:
            cpu: 5m
          limits:
            cpu: 200m
    node:
      # sha256 of the decoded driver-config-file.yaml. Reloader restarts the
      # pods when the Secret changes; this records which config they run.
      podAnnotations:
        checksum/secret: 1877662e23dc0eb04ec10065eb9d8956685420007386d46a571f97290868ecda
      hostAliases: '[{"ip":"10.0.0.203","hostnames":["nas.home.bariss.dev"]}]'
      kubeletHostPath: /var/lib/kubelet
      # Talos: iscsiadm and its node database come from the iscsi-tools
      # extension on the host, so the driver runs it in the host's namespaces
      # (democratic-csi README, "Talos").
      hostPID: true
      # NodeStage runs iscsiadm, mkfs and fsck in the driver container.
      driver:
        extraEnv:
          - name: ISCSIADM_HOST_STRATEGY
            value: nsenter
          - name: ISCSIADM_HOST_PATH
            value: /usr/local/sbin/iscsiadm
        iscsiDirHostPath: /var/iscsi
        iscsiDirHostPathType: ""
        image:
          registry: ghcr.io/democratic-csi/democratic-csi
          # Same release as the controller.
          tag: v1.9.5@sha256:fc3b7d7ed3a616714139525075312758e23a5d425ffb539ad12c9bd20fb6001f
        resources:
          requests:
            cpu: 10m
          limits:
            cpu: "1"
      driverRegistrar:
        resources:
          requests:
            cpu: 5m
          limits:
            cpu: 100m
      cleanup:
        resources:
          requests:
            cpu: 5m
          limits:
            cpu: 100m
    csiProxy:
      resources:
        requests:
          cpu: 5m
        limits:
          cpu: 200m
    csiDriver:
      name: org.democratic-csi.iscsi
    storageClasses:
      - name: freenas-iscsi-csi
        defaultClass: true
        reclaimPolicy: Retain
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: ext4
        # Each session gets a 30-minute replacement timeout, so a TrueNAS
        # restart of up to 30 minutes doesn't fail the mounted volumes. The
        # driver writes "node-db.*" keys into the iSCSI node record. The chart
        # creates node-stage-secret-freenas-iscsi-csi-democratic-csi-iscsi;
        # every iSCSI PV in Git names it in csi.nodeStageSecretRef.
        secrets:
          node-stage-secret:
            node-db.node.session.timeo.replacement_timeout: "1800"
        mountOptions:
          - noatime
    driver:
      existingConfigSecret: democratic-csi-iscsi-driver-config
      config:
        driver: freenas-api-iscsi
