apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  releaseName: reloader
  chart:
    spec:
      chart: reloader
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
      # https://github.com/stakater/Reloader/blob/chart-v2.2.19/deployments/kubernetes/chart/reloader/values.yaml
      version: 2.2.19
  interval: 1h0m0s
  install:
    remediation:
      retries: 3
  values:
    reloader:
      # Restart every workload whose ConfigMaps or Secrets change, unless it
      # opts out with reloader.stakater.com/auto: "false" (Prometheus does:
      # its rule changes reload without a restart).
      autoReloadAll: true
      deployment:
        resources:
          requests:
            cpu: 10m
          limits:
            cpu: 250m
