apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  releaseName: reloader
  chart:
    spec:
      chart: reloader
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system
      version: 2.2.18
  interval: 1h0m0s
  install:
    remediation:
      retries: 3
  values:
    reloader:
      autoReloadAll: true
      deployment:
        resources:
          requests:
            cpu: 10m
          limits:
            cpu: 250m
