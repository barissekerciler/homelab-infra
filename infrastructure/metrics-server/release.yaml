apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
spec:
  releaseName: metrics-server
  chart:
    spec:
      chart: metrics-server
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
      # https://github.com/kubernetes-sigs/metrics-server/blob/metrics-server-helm-chart-3.14.0/charts/metrics-server/values.yaml
      version: 3.14.0
  interval: 1h0m0s
  install:
    remediation:
      retries: 3
  values:
    # Talos kubelets serve a self-signed certificate.
    args:
      - --kubelet-insecure-tls
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
