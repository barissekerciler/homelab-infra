apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
spec:
  releaseName: descheduler
  chart:
    spec:
      chart: descheduler
      sourceRef:
        kind: HelmRepository
        name: descheduler
        namespace: flux-system
      # https://github.com/kubernetes-sigs/descheduler/blob/descheduler-helm-chart-0.37.0/charts/descheduler/values.yaml
      version: 0.37.0
  interval: 1h0m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    kind: CronJob
    schedule: "17 * * * *"
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 1
    ttlSecondsAfterFinished: 3600
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    deschedulerPolicy:
      maxNoOfPodsToEvictTotal: 5
      profiles:
        - name: balance
          pluginConfig:
            - name: DefaultEvictor
              args:
                # Only a pod that fits on another node: it cannot come back
                # to the node it left.
                nodeFit: true
                minPodAge: 24h
                podProtections:
                  extraEnabled:
                    - PodsWithPVC
            - name: LowNodeUtilization
              args:
                # Evictions stop once the underutilized node reaches 50%,
                # so the next run finds nothing to do.
                thresholds:
                  cpu: 50
                  memory: 50
                targetThresholds:
                  cpu: 80
                  memory: 80
                evictableNamespaces:
                  exclude:
                    - kube-system
                    - flux-system
                    - descheduler
                    - adguard
                    - claude-agents
                    - claude-code
                    - postgresql
                    - openbao
          plugins:
            balance:
              enabled:
                - LowNodeUtilization
