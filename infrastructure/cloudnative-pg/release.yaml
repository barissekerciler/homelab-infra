# The CloudNativePG operator, the official chart. It runs the PostgreSQL
# cluster in apps/production/postgresql (Cluster, DatabaseRole, Database,
# ScheduledBackup). The chart installs the postgresql.cnpg.io CRDs; the
# infrastructure Kustomization health-checks the ones later Kustomizations use.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  releaseName: cloudnative-pg
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.1
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  interval: 1h0m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      create: true
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
