# Every ExternalSecret reads from OpenBao's KV v2 mount "secret", key
# <namespace>/<secret name>. ESO signs in with its ServiceAccount through
# auth/kubernetes, role "external-secrets": read on secret/* only
# (apps/production/openbao/README.md).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  # Every namespace but the Claude Code box's: it is admin in claude-agents
  # and must not pull other namespaces' secrets through this store. The
  # admission policy there blocks ExternalSecrets too
  # (apps/production/claude-agents/admission.yaml).
  conditions:
    - namespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: NotIn
            values: [claude-agents, claude-code]
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
