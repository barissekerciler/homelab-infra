# External Secrets Operator, the official chart. It turns ExternalSecrets into
# Secrets from OpenBao (ClusterSecretStore "openbao", ../store). Its own Flux
# Kustomization (clusters/homelab/external-secrets.yaml) installs it before
# cert-issuers and infrastructure, so their ExternalSecrets find the CRDs.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  releaseName: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: 2.14.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  interval: 1h0m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    installCRDs: true
    # Reuse the OpenBao token instead of a Kubernetes login per sync.
    vault:
      enableTokenCache: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
    certController:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
