# The recommender keeps its history in VerticalPodAutoscalerCheckpoints, not
# Prometheus: Prometheus rewrites label names (app.kubernetes.io/name becomes
# app_kubernetes_io_name), so most charts' selectors never match it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
spec:
  releaseName: vpa
  chart:
    spec:
      chart: vertical-pod-autoscaler
      sourceRef:
        kind: HelmRepository
        name: autoscaler
        namespace: flux-system
      # https://github.com/kubernetes/autoscaler/blob/vertical-pod-autoscaler-chart-0.16.0/vertical-pod-autoscaler/charts/vertical-pod-autoscaler/values.yaml
      version: 0.16.0
  interval: 1h0m0s
  values:
    admissionController:
      # Off: the requests in Git come from measured use (docs/design-decisions.md).
      # Turn it on once the recommender's targets match them; until then VPA
      # only recommends (Goldilocks shows the targets).
      enabled: false
      replicas: 1
      podDisruptionBudget:
        enabled: false
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
    recommender:
      replicas: 1
      podDisruptionBudget:
        enabled: false
      extraArgs:
        # VPA's defaults (25m, 250 MB per pod) would raise most small pods.
        - --pod-recommendation-min-cpu-millicores=10
        - --pod-recommendation-min-memory-mb=32
        # The same rule as the requests in Git: memory at the median of
        # 5-minute peaks over 14 days, CPU at the 90th percentile, plus 10 %.
        # VPA's defaults take daily peaks over 8 days, so every pod would get
        # its peak as request.
        - --memory-aggregation-interval=5m
        - --memory-aggregation-interval-count=4032
        - --memory-histogram-decay-half-life=168h
        - --cpu-histogram-decay-half-life=168h
        - --target-memory-percentile=0.5
        - --target-cpu-percentile=0.9
        - --recommendation-margin-fraction=0.1
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 512Mi
    updater:
      replicas: 1
      podDisruptionBudget:
        enabled: false
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
