apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: busybox
  namespace: flux-system
  labels:
    image-automation: flux-system-apps
spec:
  imageRepositoryRef:
    name: busybox
  filterTags:
    pattern: '^\d+\.\d+\.\d+$'
  policy:
    semver:
      range: "^1.38.0"
  digestReflectionPolicy: IfNotPresent
