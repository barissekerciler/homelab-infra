apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: recyclarr
  namespace: flux-system
  labels:
    image-automation: flux-system-apps
spec:
  imageRepositoryRef:
    name: recyclarr
  filterTags:
    pattern: '^\d+\.\d+\.\d+$'
  policy:
    semver:
      range: "^8.8.1"
  digestReflectionPolicy: IfNotPresent
