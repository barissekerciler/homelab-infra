# Frigate's model export needs Python 3.11, and uv publishes no versioned
# 3.11 tags any more: follow python3.11-bookworm-slim and write its digest.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: uv-python3-11
  namespace: flux-system
  labels:
    image-automation: flux-system-apps
spec:
  imageRepositoryRef:
    name: uv-python3-11
  filterTags:
    pattern: '^python3\.11-bookworm-slim$'
  policy:
    alphabetical:
      order: asc
  digestReflectionPolicy: Always
  interval: 12h
