apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: gluetun
  namespace: flux-system
  labels:
    image-automation: flux-system-apps
spec:
  imageRepositoryRef:
    name: gluetun
  filterTags:
    pattern: '^v\d+\.\d+\.\d+$'
  policy:
    semver:
      range: "^3.41.3"
  digestReflectionPolicy: IfNotPresent
