# AdGuard Home 0.107.x (a 1.x is a manual change of this range).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: adguardhome
  namespace: flux-system
  labels:
    image-automation: flux-system-apps
spec:
  imageRepositoryRef:
    name: adguardhome
  filterTags:
    pattern: '^v\d+\.\d+\.\d+$'
  policy:
    semver:
      range: "~0.107.80"
  digestReflectionPolicy: IfNotPresent
