# Redis 8 on Alpine.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: redis
  namespace: flux-system
  labels:
    image-automation: flux-system-apps
spec:
  imageRepositoryRef:
    name: redis
  filterTags:
    pattern: '^(?P<version>\d+\.\d+\.\d+)-alpine$'
    extract: '$version'
  policy:
    semver:
      range: "^8.12.0"
  digestReflectionPolicy: IfNotPresent
