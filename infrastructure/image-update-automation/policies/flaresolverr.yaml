apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: flaresolverr
  namespace: flux-system
  labels:
    image-automation: flux-system-apps
spec:
  imageRepositoryRef:
    name: flaresolverr
  filterTags:
    pattern: '^v\d+\.\d+\.\d+$'
  policy:
    semver:
      range: "^3.5.2"
  digestReflectionPolicy: IfNotPresent
