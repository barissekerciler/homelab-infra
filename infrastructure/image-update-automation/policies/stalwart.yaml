apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: stalwart
  namespace: flux-system
  labels:
    image-automation: flux-system-apps
spec:
  imageRepositoryRef:
    name: stalwart
  filterTags:
    pattern: '^v\d+\.\d+\.\d+$'
  policy:
    semver:
      range: "^1.2.0"
  digestReflectionPolicy: IfNotPresent
