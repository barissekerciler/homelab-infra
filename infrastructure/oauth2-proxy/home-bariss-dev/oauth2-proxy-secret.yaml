# Values: OpenBao secret/oauth2-proxy-home-bariss-dev/oauth2-proxy-secret (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-secret
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: oauth2-proxy-secret
  data:
    - secretKey: client-id
      remoteRef:
        key: oauth2-proxy-home-bariss-dev/oauth2-proxy-secret
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: oauth2-proxy-home-bariss-dev/oauth2-proxy-secret
        property: client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: oauth2-proxy-home-bariss-dev/oauth2-proxy-secret
        property: cookie-secret
