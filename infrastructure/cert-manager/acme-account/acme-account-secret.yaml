# Values: OpenBao secret/flux-system/acme-account (KV v2).
# ACME_EMAIL: the Let's Encrypt account's contact address.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: acme-account
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: acme-account
  data:
    - secretKey: ACME_EMAIL
      remoteRef:
        key: flux-system/acme-account
        property: ACME_EMAIL
