# Values: OpenBao secret/cert-manager/cloudflare-api-key-secret (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-key-secret
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cloudflare-api-key-secret
  data:
    - secretKey: api-key
      remoteRef:
        key: cert-manager/cloudflare-api-key-secret
        property: api-key
