# Grafana's dashboard sidecar loads ConfigMaps labelled grafana_dashboard into
# the folder named by grafana_folder. Edit the JSON here; Grafana shows these
# dashboards read-only (use Save as for a copy to play with).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: grafana-dashboards-homelab
    files:
      - homelab.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Homelab
