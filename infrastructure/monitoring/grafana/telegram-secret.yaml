# Values: OpenBao secret/monitoring/grafana-telegram (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-telegram
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-telegram
  data:
    - secretKey: bot-token
      remoteRef:
        key: monitoring/grafana-telegram
        property: bot-token
    - secretKey: chat-id
      remoteRef:
        key: monitoring/grafana-telegram
        property: chat-id
