# Values: OpenBao secret/monitoring/grafana-admin (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-admin
  data:
    - secretKey: admin-password
      remoteRef:
        key: monitoring/grafana-admin
        property: admin-password
    - secretKey: admin-user
      remoteRef:
        key: monitoring/grafana-admin
        property: admin-user
