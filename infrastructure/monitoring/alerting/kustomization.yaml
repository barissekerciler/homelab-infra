# Grafana's alert sidecar loads ConfigMaps labelled grafana_alert into
# Grafana's alerting provisioning: the rules (generated by alerts.py), the
# Telegram contact points, the notification policy and the message template.
# Grafana shows them read-only. Tenants add rules the same way, with file
# names of their own.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: grafana-alerting
    files:
      - rules.json
      - contact-points.yaml
      - policies.yaml
      - templates.yaml
    options:
      disableNameSuffixHash: true
      labels:
        grafana_alert: "1"
