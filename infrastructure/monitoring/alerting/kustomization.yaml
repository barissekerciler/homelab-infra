apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: grafana-alerting
    files:
      - rules.json
      - contact-points.yaml
      - policies.yaml
      - templates.yaml
    options:
      disableNameSuffixHash: true
      labels:
        grafana_alert: "1"
