user_rules:
  # Tailscale addresses come from OpenBao (the ExternalSecret
  # adguardhome-config): tailscale_pi, tailscale_homelab, tailscale_homelab2.

  # The rewrites below answer A only, and no home.bariss.dev name has a public
  # AAAA record, so AAAA went upstream and came back NXDOMAIN. musl (Home
  # Assistant's image) then drops the A answer too. An empty NOERROR keeps it.
  - "||home.bariss.dev^$dnstype=AAAA,dnsrewrite=NOERROR;;"

  - "!- local config"
  - "speedport.ip^$client='local',dnstype=A,dnsrewrite=NOERROR;A;10.0.0.1"

  # Cluster ingresses: Traefik answers every home.bariss.dev name on both
  # nodes, so one wildcard per client group covers them all and no host
  # name is listed here. A name without a route gets Traefik's 404. The
  # Pi's names (Caddy) are left out with denyallow and answered below;
  # matching dnsrewrite rules would otherwise add up to three addresses.
  - "!- cluster ingresses"
  - "||home.bariss.dev^$client='local',dnstype=A,denyallow=dns2.home.bariss.dev|nas.home.bariss.dev|router.home.bariss.dev|raspi.home.bariss.dev|ha.home.bariss.dev|vault.home.bariss.dev|cudy.home.bariss.dev,dnsrewrite=NOERROR;A;10.0.0.150"
  - "||home.bariss.dev^$client='local',dnstype=A,denyallow=dns2.home.bariss.dev|nas.home.bariss.dev|router.home.bariss.dev|raspi.home.bariss.dev|ha.home.bariss.dev|vault.home.bariss.dev|cudy.home.bariss.dev,dnsrewrite=NOERROR;A;10.0.0.151"
  - "||home.bariss.dev^$client='tailscale',dnstype=A,denyallow=dns2.home.bariss.dev|nas.home.bariss.dev|router.home.bariss.dev|raspi.home.bariss.dev|ha.home.bariss.dev|vault.home.bariss.dev|cudy.home.bariss.dev,dnsrewrite=NOERROR;A;{{ .tailscale_homelab }}"
  - "||home.bariss.dev^$client='tailscale',dnstype=A,denyallow=dns2.home.bariss.dev|nas.home.bariss.dev|router.home.bariss.dev|raspi.home.bariss.dev|ha.home.bariss.dev|vault.home.bariss.dev|cudy.home.bariss.dev,dnsrewrite=NOERROR;A;{{ .tailscale_homelab2 }}"

  - "!- Raspberry Pi (Caddy on 10.0.0.87)"
  - "||dns2.home.bariss.dev^$client='local',dnstype=A,dnsrewrite=NOERROR;A;10.0.0.87"
  - "||nas.home.bariss.dev^$client='local',dnstype=A,dnsrewrite=NOERROR;A;10.0.0.87"
  - "||router.home.bariss.dev^$client='local',dnstype=A,dnsrewrite=NOERROR;A;10.0.0.87"
  - "||raspi.home.bariss.dev^$client='local',dnstype=A,dnsrewrite=NOERROR;A;10.0.0.87"
  - "||ha.home.bariss.dev^$client='local',dnstype=A,dnsrewrite=NOERROR;A;10.0.0.87"
  - "||vault.home.bariss.dev^$client='local',dnstype=A,dnsrewrite=NOERROR;A;10.0.0.87"
  - "||cudy.home.bariss.dev^$client='local',dnstype=A,dnsrewrite=NOERROR;A;10.0.0.87"
  - "||dns2.home.bariss.dev^$client='tailscale',dnstype=A,dnsrewrite=NOERROR;A;{{ .tailscale_pi }}"
  - "||nas.home.bariss.dev^$client='tailscale',dnstype=A,dnsrewrite=NOERROR;A;{{ .tailscale_pi }}"
  - "||router.home.bariss.dev^$client='tailscale',dnstype=A,dnsrewrite=NOERROR;A;{{ .tailscale_pi }}"
  - "||raspi.home.bariss.dev^$client='tailscale',dnstype=A,dnsrewrite=NOERROR;A;{{ .tailscale_pi }}"
  - "||ha.home.bariss.dev^$client='tailscale',dnstype=A,dnsrewrite=NOERROR;A;{{ .tailscale_pi }}"
  - "||vault.home.bariss.dev^$client='tailscale',dnstype=A,dnsrewrite=NOERROR;A;{{ .tailscale_pi }}"
  - "||cudy.home.bariss.dev^$client='tailscale',dnstype=A,dnsrewrite=NOERROR;A;{{ .tailscale_pi }}"

  - "!- general config"
  - "@@||bariss.dev^$important"

  - "!- LG TV config"
  # Blocks the TV's built-in Alexa and Amazon telemetry for the TV only.
  # amazonaws.com and cloudfront.net stay open: LG's own services use them.
  - "||avsxappcaptiveportal.com^$client=10.0.0.209,important"
  - "||amazon.com^$client=10.0.0.209,important"
  - "||amazon.de^$client=10.0.0.209,important"
  - "||amazon.dev^$client=10.0.0.209,important"
  - "||a2z.com^$client=10.0.0.209,important"
  - "||amazonvideo.com^$client=10.0.0.209,important"
  - "||media-amazon.com^$client=10.0.0.209,important"

