apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguardhome
  namespace: adguardhome
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app: adguardhome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adguardhome
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: adguardhome
    spec:
      nodeSelector:
        kubernetes.io/hostname: homelab
      hostNetwork: true
      initContainers:
        - name: init-config
          image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4 # {"$imagepolicy": "flux-system:busybox"}
          command: ["sh", "-c", "cp /tmp/config/AdGuardHome.yaml /opt/adguardhome/conf/"]
          volumeMounts:
            - name: config-template
              mountPath: /tmp/config
            - name: adguardhome-conf
              mountPath: /opt/adguardhome/conf
          resources:
            requests:
              cpu: 10m
            limits:
              cpu: 100m
      containers:
        - name: adguardhome
          image: adguard/adguardhome:v1.0.0@sha256:f00a586f0d1caa74f149340bfb225014960310488ffa838406b89256900a96c2 # {"$imagepolicy": "flux-system:adguardhome"}
          ports:
            - containerPort: 53
              protocol: TCP
            - containerPort: 53
              protocol: UDP
            - containerPort: 55080
              protocol: TCP
            - containerPort: 50443
              protocol: TCP
            - containerPort: 50443
              protocol: UDP
            - containerPort: 3000
              protocol: TCP
            - containerPort: 853
              protocol: TCP
            - containerPort: 784
              protocol: UDP
            - containerPort: 853
              protocol: UDP
            - containerPort: 8853
              protocol: UDP
          resources:
            limits:
              memory: 640Mi
              cpu: 100m
            requests:
              memory: 256Mi
              cpu: 50m
          volumeMounts:
            - name: adguardhome-data
              mountPath: /opt/adguardhome/work
            - name: adguardhome-conf
              mountPath: /opt/adguardhome/conf
      volumes:
        - name: adguardhome-data
          emptyDir: {}
        - name: config-template
          secret:
            secretName: adguardhome-config
        - name: adguardhome-conf
          emptyDir: {}
