apiVersion: v1
kind: Service
metadata:
  name: adguardhome-service
  namespace: adguardhome
spec:
  # AdGuard runs on homelab's host network and answers there itself; this
  # Service only backs the UI's Ingress. A NodePort would add DNS and the
  # plain-HTTP UI on random ports of every node address.
  type: ClusterIP
  selector:
    app: adguardhome
  ports:
    - port: 53
      targetPort: 53
      protocol: TCP
      name: dns-tcp
    - port: 53
      targetPort: 53
      protocol: UDP
      name: dns-udp
    - port: 55080
      targetPort: 55080
      protocol: TCP
      name: http-web
    - port: 50443
      targetPort: 50443
      protocol: TCP
      name: https-tcp
    - port: 50443
      targetPort: 50443
      protocol: UDP
      name: https-udp
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: ui
    - port: 853
      targetPort: 853
      protocol: TCP
      name: dot-tcp
    - port: 784
      targetPort: 784
      protocol: UDP
      name: dot-udp-1
    - port: 853
      targetPort: 853
      protocol: UDP
      name: dot-udp-2
    - port: 8853
      targetPort: 8853
      protocol: UDP
      name: dot-udp-3
    - port: 5443
      targetPort: 5443
      protocol: TCP
      name: quic-tcp
    - port: 5443
      targetPort: 5443
      protocol: UDP
      name: quic-udp
