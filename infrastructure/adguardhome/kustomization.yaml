apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: adguard
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - adguardhome-config-secret.yaml

# AdGuardHome.yaml without its secrets. The ExternalSecret adguardhome-config
# renders it with the admin password hash into the Secret the pod copies at
# start; Reloader restarts AdGuard when that Secret changes.
configMapGenerator:
  - name: adguardhome-config-template
    files:
      - AdGuardHome.yaml=adguardhome-config.yaml
    options:
      disableNameSuffixHash: true
