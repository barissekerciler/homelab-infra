apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: adguard
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - adguardhome-config-secret.yaml

configMapGenerator:
  - name: adguardhome-config-template
    files:
      - AdGuardHome.yaml=adguardhome-config.yaml
    options:
      disableNameSuffixHash: true
