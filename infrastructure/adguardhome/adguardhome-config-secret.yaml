# Values: OpenBao secret/adguard/adguardhome-config (KV v2).
# admin_password_hash: bcrypt hash of the admin login (htpasswd -B -n admin).
# tailscale_homelab, tailscale_homelab2, tailscale_pi: the nodes' and the Pi's
# Tailscale addresses.
# The rest of AdGuardHome.yaml comes from the ConfigMap adguardhome-config-template.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adguardhome-config
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: adguardhome-config
    template:
      engineVersion: v2
      mergePolicy: Merge
      templateFrom:
        - configMap:
            name: adguardhome-config-template
            items:
              - key: AdGuardHome.yaml
                templateAs: Values
  data:
    - secretKey: admin_password_hash
      remoteRef:
        key: adguard/adguardhome-config
        property: admin_password_hash
    - secretKey: tailscale_homelab
      remoteRef:
        key: adguard/adguardhome-config
        property: tailscale_homelab
    - secretKey: tailscale_homelab2
      remoteRef:
        key: adguard/adguardhome-config
        property: tailscale_homelab2
    - secretKey: tailscale_pi
      remoteRef:
        key: adguard/adguardhome-config
        property: tailscale_pi
