# Every kustomization that creates Namespaces lists this component, so a new
# namespace gets VPA mode Initial unless it says "off" itself.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Namespace
      annotationSelector: goldilocks.fairwinds.com/vpa-update-mode!=off
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: any
        annotations:
          goldilocks.fairwinds.com/vpa-update-mode: Initial
          goldilocks.fairwinds.com/vpa-resource-policy: '{"containerPolicies":[{"containerName":"*","controlledValues":"RequestsOnly","minAllowed":{"cpu":"10m","memory":"32Mi"}}]}'
