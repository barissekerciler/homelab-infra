# Only for its flux_resource_info metrics, which the Flux alert and the Homelab
# dashboard read. There is no FluxInstance; the Web UI is off.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  releaseName: flux-operator
  chart:
    spec:
      chart: flux-operator
      # https://artifacthub.io/packages/helm/flux-operator/flux-operator/0.62.1?modal=values
      version: 0.62.1
      sourceRef:
        kind: HelmRepository
        name: flux-operator
        namespace: flux-system
  interval: 1h0m0s
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: "1"
        memory: 1Gi
    web:
      enabled: false
