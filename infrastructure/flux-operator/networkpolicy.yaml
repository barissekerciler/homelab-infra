# The Web UI trusts whoever reaches it (Anonymous, as flux-web-admins); the
# GitHub sign-in sits in Traefik. So only Traefik may connect to its port.
# The chart's own policy, which admits every namespace, is off (release.yaml);
# Flux's bundled policies still admit metrics scraping on 8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flux-operator-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
      app.kubernetes.io/instance: flux-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 9080
