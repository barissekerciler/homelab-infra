apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  releaseName: tuppr
  chart:
    spec:
      chart: tuppr
      sourceRef:
        kind: HelmRepository
        name: home-operations
        namespace: flux-system
      # https://github.com/home-operations/tuppr/blob/0.5.13/charts/tuppr/values.yaml
      version: 0.5.13
  interval: 1h0m0s
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    rbac:
      # The chart's default lets health checks read every resource, Secrets
      # included; the checks in upgrades/ only look at Nodes.
      healthCheckRules:
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get", "list", "watch"]
