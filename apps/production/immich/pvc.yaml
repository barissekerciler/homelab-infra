apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: immich-library
spec:
  storageClassName: freenas-nfs-csi
  volumeName: immich-library-nfs-pv
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Ti
---
# Thumbnails and previews: many small files, kept on iSCSI.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: immich-thumbs
spec:
  volumeName: pvc-1e783262-1df7-4679-93c7-fb74cb5a15a4
  storageClassName: freenas-iscsi-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: immich-ml-cache
spec:
  volumeName: pvc-1b2d2d48-0ab4-4caf-8669-36a1c9986c6e
  storageClassName: freenas-iscsi-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
