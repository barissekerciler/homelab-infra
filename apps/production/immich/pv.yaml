# The TrueNAS Immich app's data directory, used in place.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library-nfs-pv
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app: immich
spec:
  capacity:
    storage: 1Ti
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: freenas-nfs-csi
  nfs:
    server: 10.0.0.203
    path: /mnt/pool1/apps/immich-secure/userdata
  mountOptions:
    - noatime
    - nfsvers=4.1
    - nconnect=4
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pvc-1b2d2d48-0ab4-4caf-8669-36a1c9986c6e
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    pv.kubernetes.io/provisioned-by: org.democratic-csi.iscsi
spec:
  capacity:
    storage: 20Gi
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: freenas-iscsi-csi
  mountOptions:
  - noatime
  csi:
    driver: org.democratic-csi.iscsi
    nodeStageSecretRef:
      name: node-stage-secret-freenas-iscsi-csi-democratic-csi-iscsi
      namespace: democratic-csi-iscsi
    fsType: ext4
    volumeAttributes:
      interface: ''
      iqn: iqn.2005-10.org.freenas.ctl:csi-pvc-1b2d2d48-0ab4-4caf-8669-36a1c9986c6e-cluster
      lun: '0'
      node_attach_driver: iscsi
      portal: 10.0.0.203:3260
      portals: ''
      provisioner_driver: freenas-api-iscsi
      provisioner_driver_instance_id: democratic-csi-iscsi
      storage.kubernetes.io/csiProvisionerIdentity: 1791899011228-3547-org.democratic-csi.iscsi
    volumeHandle: pvc-1b2d2d48-0ab4-4caf-8669-36a1c9986c6e
  claimRef:
    namespace: immich
    name: immich-ml-cache
---
