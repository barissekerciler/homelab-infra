# Values: OpenBao secret/postgresql/immich-db (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: immich-db
  data:
    - secretKey: password
      remoteRef:
        key: postgresql/immich-db
        property: password
