apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  releaseName: immich
  chart:
    spec:
      chart: immich
      # 0.x chart whose minors rework the values: patches only.
      version: "0.13.x"
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: flux-system
  interval: 1h0m0s
  values:
    controllers:
      main:
        containers:
          main:
            env:
              TZ: Europe/Berlin
              IMMICH_LOG_LEVEL: log
              DB_HOSTNAME: postgres-rw.postgresql.svc.cluster.local
              DB_PORT: "5432"
              DB_USERNAME: immich
              DB_DATABASE_NAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db
                    key: password
              IMMICH_MACHINE_LEARNING_CLIP_MODEL_NAME: immich-app/ViT-SO400M-16-SigLIP2-384__webli
              IMMICH_MACHINE_LEARNING_FACIAL_RECOGNITION_MODEL_NAME: immich-app/antelopev2
              IMMICH_MACHINE_LEARNING_CLASSIFICATION_MODEL_NAME: immich-app/antelopev2

    immich:
      persistence:
        library:
          existingClaim: immich-library

    valkey:
      enabled: true
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 256Mi

    server:
      controllers:
        main:
          # thumbs is RWO: a surge pod on another node waits on Multi-Attach.
          strategy: Recreate
          # The photos (infrastructure/priority-classes).
          pod:
            priorityClassName: homelab-critical
          containers:
            main:
              image:
                tag: v3.4.2 # {"$imagepolicy": "flux-system:immich-server:tag"}
                digest: sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd # {"$imagepolicy": "flux-system:immich-server:digest"}
              resources:
                requests:
                  cpu: 5m
                  memory: 896Mi
                limits:
                  cpu: "2"
                  # Each iPhone DNG thumbnail needs ~0.5Gi more while it decodes;
                  # six at once do not fit in 4Gi.
                  memory: 8Gi
      defaultPodOptions:
        # TrueNAS's apps user (568) owns the library files.
        securityContext:
          runAsUser: 568
          runAsGroup: 568
          fsGroup: 568
          fsGroupChangePolicy: OnRootMismatch
      persistence:
        # A fresh iSCSI volume. Immich does not refill it by itself: the
        # "Missing" thumbnail job only checks asset_file rows in the DB, so an
        # empty volume needs Generate Thumbnails -> "All" once.
        thumbs:
          enabled: true
          existingClaim: immich-thumbs
          globalMounts:
            - path: /data/thumbs

    machine-learning:
      controllers:
        main:
          # The model cache is RWO: a surge pod on another node waits on
          # Multi-Attach while the old pod holds the volume.
          strategy: Recreate
          containers:
            main:
              image:
                tag: v3.4.2 # {"$imagepolicy": "flux-system:immich-machine-learning:tag"}
                digest: sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91 # {"$imagepolicy": "flux-system:immich-machine-learning:digest"}
              # Loading the 8.5 GB SigLIP2 model blocks /ping for minutes on one
              # core; the chart's 1 s / 3 failure probes would kill it mid-load.
              probes:
                liveness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /ping
                      port: http
                    periodSeconds: 30
                    timeoutSeconds: 10
                    failureThreshold: 10
                readiness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /ping
                      port: http
                    periodSeconds: 10
                    timeoutSeconds: 10
                    failureThreshold: 30
              resources:
                requests:
                  cpu: 5m
                  memory: 2288Mi
                limits:
                  cpu: "1"
                  memory: 5632Mi
      defaultPodOptions:
        securityContext:
          runAsUser: 568
          runAsGroup: 568
          fsGroup: 568
          fsGroupChangePolicy: OnRootMismatch
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          existingClaim: immich-ml-cache
