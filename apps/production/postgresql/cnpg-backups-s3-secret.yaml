# Values: OpenBao secret/shared/cnpg-backups-s3 (KV v2).
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY: the SeaweedFS S3 key for the
# bucket cnpg-backups only, for the Barman Cloud backups (backups.yaml).
# Endpoint http://10.0.0.203:8333; SeaweedFS takes any region name. SeaweedFS's
# identities file on the NAS holds the same value (truenas/apps/seaweedfs).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backups-s3
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cnpg-backups-s3
    template:
      mergePolicy: Merge
      data:
        AWS_REGION: us-east-1
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: shared/cnpg-backups-s3
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: shared/cnpg-backups-s3
        property: AWS_SECRET_ACCESS_KEY
