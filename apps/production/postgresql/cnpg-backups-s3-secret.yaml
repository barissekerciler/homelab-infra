# Values: OpenBao secret/shared/cnpg-backups-s3 (KV v2).
# SeaweedFS's identities file on the NAS holds the same key (truenas/apps/seaweedfs).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backups-s3
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cnpg-backups-s3
    template:
      mergePolicy: Merge
      data:
        AWS_REGION: us-east-1
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: shared/cnpg-backups-s3
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: shared/cnpg-backups-s3
        property: AWS_SECRET_ACCESS_KEY
