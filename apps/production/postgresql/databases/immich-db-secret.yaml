# Values: OpenBao secret/postgresql/immich-db (KV v2).
# Role immich's password (the DatabaseRole's passwordSecret), generated once
# by the PushSecret immich-db in immich.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db
  namespace: postgresql
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: immich-db
    template:
      type: kubernetes.io/basic-auth
      mergePolicy: Merge
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: immich
  data:
    - secretKey: password
      remoteRef:
        key: postgresql/immich-db
        property: password
