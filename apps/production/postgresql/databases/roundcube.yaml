# Roundcube (apps/production/mail/roundcube).
# Role roundcube; its password is generated once into OpenBao
# secret/postgresql/roundcube-db (apps/base/postgresql/passwords.yaml) and
# read back by roundcube-db-secret.yaml.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: roundcube-db
  namespace: postgresql
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - kind: SecretStore
      name: openbao-passwords
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: role-password
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: postgresql/roundcube-db
          property: password
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: roundcube
  namespace: postgresql
spec:
  cluster:
    name: postgres
  name: roundcube
  login: true
  passwordSecret:
    name: roundcube-db
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: roundcube
  namespace: postgresql
spec:
  cluster:
    name: postgres
  name: roundcube
  owner: roundcube
