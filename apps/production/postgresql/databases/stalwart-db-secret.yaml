# Values: OpenBao secret/postgresql/stalwart-db (KV v2).
# Role stalwart's password (the DatabaseRole's passwordSecret), generated once
# by the PushSecret stalwart-db in stalwart.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-db
  namespace: postgresql
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: stalwart-db
    template:
      type: kubernetes.io/basic-auth
      mergePolicy: Merge
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: stalwart
  data:
    - secretKey: password
      remoteRef:
        key: postgresql/stalwart-db
        property: password
