# Values: OpenBao secret/postgresql/roundcube-db (KV v2).
# Role roundcube's password (the DatabaseRole's passwordSecret), generated once
# by the PushSecret roundcube-db in roundcube.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: roundcube-db
  namespace: postgresql
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: roundcube-db
    template:
      type: kubernetes.io/basic-auth
      mergePolicy: Merge
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: roundcube
  data:
    - secretKey: password
      remoteRef:
        key: postgresql/roundcube-db
        property: password
