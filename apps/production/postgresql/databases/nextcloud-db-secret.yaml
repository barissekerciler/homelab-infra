# Values: OpenBao secret/postgresql/nextcloud-db (KV v2).
# Role nextcloud's password (the DatabaseRole's passwordSecret), generated once
# by the PushSecret nextcloud-db in nextcloud.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-db
  namespace: postgresql
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nextcloud-db
    template:
      type: kubernetes.io/basic-auth
      mergePolicy: Merge
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: nextcloud
  data:
    - secretKey: password
      remoteRef:
        key: postgresql/nextcloud-db
        property: password
