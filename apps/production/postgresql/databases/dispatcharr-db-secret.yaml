# Values: OpenBao secret/postgresql/dispatcharr-db (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dispatcharr-db
  namespace: postgresql
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: dispatcharr-db
    template:
      type: kubernetes.io/basic-auth
      mergePolicy: Merge
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: dispatcharr
  data:
    - secretKey: password
      remoteRef:
        key: postgresql/dispatcharr-db
        property: password
