# Stalwart (apps/production/mail/stalwart): its settings and the mail itself,
# in stalwart_v1. `stalwart` holds the v0.16 store, kept as the way back.
# Role stalwart; its password is generated once into OpenBao
# secret/postgresql/stalwart-db (apps/base/postgresql/passwords.yaml) and
# read back by stalwart-db-secret.yaml.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: stalwart-db
  namespace: postgresql
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - kind: SecretStore
      name: openbao-passwords
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: role-password
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: postgresql/stalwart-db
          property: password
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: stalwart
  namespace: postgresql
spec:
  cluster:
    name: postgres
  name: stalwart
  login: true
  passwordSecret:
    name: stalwart-db
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: stalwart
  namespace: postgresql
spec:
  cluster:
    name: postgres
  name: stalwart
  owner: stalwart
---
# Stalwart v1's store, copied from the v0.16 store in `stalwart` by
# stalwart-migrate (v1 cannot open the v0.16 layout).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: stalwart-v1
  namespace: postgresql
spec:
  cluster:
    name: postgres
  name: stalwart_v1
  owner: stalwart
