# The replica may only run on a node without the primary (required
# anti-affinity). When those nodes have no room, the scheduler evicts a
# lower-priority pod instead of leaving the replica Pending; same value as
# homelab-critical (infrastructure/priority-classes). Cluster-scoped.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: postgres
value: 100000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: The postgres instances beat other homelab workloads.
