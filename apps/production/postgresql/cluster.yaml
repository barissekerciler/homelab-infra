apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 2
  primaryUpdateMethod: switchover
  priorityClassName: postgres
  postgresql:
    shared_preload_libraries:
      - vchord
    parameters:
      # A replica that stays away must not fill the primary's volume with WAL.
      max_slot_wal_keep_size: 40GB
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  storage:
    size: 200Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: seaweedfs
