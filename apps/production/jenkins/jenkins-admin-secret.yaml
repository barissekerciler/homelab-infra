# Values: OpenBao secret/jenkins/jenkins-admin-secret (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-admin-secret
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: jenkins-admin-secret
  data:
    - secretKey: jenkins-admin-password
      remoteRef:
        key: jenkins/jenkins-admin-secret
        property: jenkins-admin-password
    - secretKey: jenkins-admin-user
      remoteRef:
        key: jenkins/jenkins-admin-secret
        property: jenkins-admin-user
