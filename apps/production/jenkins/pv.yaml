# Volumes provisioned by the cluster, written down so a rebuilt
# cluster binds each one to the same claim.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pvc-f59e8157-d234-4073-9eba-a26ac2378f7b
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    pv.kubernetes.io/provisioned-by: org.democratic-csi.iscsi
spec:
  capacity:
    storage: 20Gi
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: freenas-iscsi-csi
  mountOptions:
  - noatime
  csi:
    driver: org.democratic-csi.iscsi
    nodeStageSecretRef:
      name: node-stage-secret-freenas-iscsi-csi-democratic-csi-iscsi
      namespace: democratic-csi-iscsi
    fsType: ext4
    volumeAttributes:
      interface: ''
      iqn: iqn.2005-10.org.freenas.ctl:csi-pvc-f59e8157-d234-4073-9eba-a26ac2378f7b-cluster
      lun: '0'
      node_attach_driver: iscsi
      portal: 10.0.0.203:3260
      portals: ''
      provisioner_driver: freenas-api-iscsi
      provisioner_driver_instance_id: democratic-csi-iscsi
      storage.kubernetes.io/csiProvisionerIdentity: 1792151047345-5199-org.democratic-csi.iscsi
    volumeHandle: pvc-f59e8157-d234-4073-9eba-a26ac2378f7b
  claimRef:
    namespace: jenkins
    name: jenkins-home
