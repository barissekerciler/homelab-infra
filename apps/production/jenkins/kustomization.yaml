apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jenkins
resources:
  - pv.yaml
  - namespace.yaml
  - release.yaml
  - jenkins-admin-secret.yaml
  - jenkins-jcasc-secret.yaml
  - ghcr-push-secret.yaml
  - jenkins-home-pvc.yaml
configMapGenerator:
  - name: jenkins-casc-config
    files:
      - jcasc.yaml
    options:
      labels:
        jenkins-jenkins-config: "true"
