# Values: OpenBao secret/jenkins/ghcr-push (KV v2).
# username and token: a classic GitHub PAT with only write:packages. The
# Jenkinsfiles mount .dockerconfigjson as the buildkit agent's
# DOCKER_CONFIG/config.json to push to ghcr.io/barissekerciler.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-push
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ghcr-push
    template:
      type: kubernetes.io/dockerconfigjson
      mergePolicy: Merge
      data:
        .dockerconfigjson: |-
          {"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: jenkins/ghcr-push
        property: username
    - secretKey: token
      remoteRef:
        key: jenkins/ghcr-push
        property: token
