# Values: OpenBao secret/jenkins/jenkins-jcasc-secrets (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-jcasc-secrets
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: jenkins-jcasc-secrets
  data:
    - secretKey: github-app-private-key
      remoteRef:
        key: jenkins/jenkins-jcasc-secrets
        property: github-app-private-key
    - secretKey: github-webhook-secret
      remoteRef:
        key: jenkins/jenkins-jcasc-secrets
        property: github-webhook-secret
