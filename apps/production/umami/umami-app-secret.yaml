# Values: OpenBao secret/umami/umami-app (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: umami-app
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: umami-app
  data:
    - secretKey: APP_SECRET
      remoteRef:
        key: umami/umami-app
        property: APP_SECRET
