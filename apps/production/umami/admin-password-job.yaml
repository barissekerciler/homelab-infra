# Umami's first migration creates admin with the password "umami"; this
# replaces it with the generated one and does nothing once it is gone.
apiVersion: batch/v1
kind: Job
metadata:
  name: umami-admin-password
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: umami-admin-password
    spec:
      restartPolicy: OnFailure
      containers:
        - name: set-password
          image: curlimages/curl:8.23.0
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: umami-admin
                  key: password
          command:
            - sh
            - -c
            - |
              set -eu
              url=http://umami:3000
              until curl -fsS -o /dev/null "$url/api/heartbeat"; do sleep 5; done
              code=$(printf '{"username":"admin","password":"umami"}' \
                | curl -sS -o /tmp/login.json -w '%{http_code}' \
                    -H 'Content-Type: application/json' --data-binary @- "$url/api/auth/login")
              case "$code" in
                200) ;;
                401) echo "admin no longer has the default password; nothing to do"; exit 0 ;;
                *) echo "sign-in answered $code"; exit 1 ;;
              esac
              token=$(sed -n 's/.*"token":"\([^"]*\)".*/\1/p' /tmp/login.json)
              printf '{"currentPassword":"umami","newPassword":"%s"}' "$ADMIN_PASSWORD" \
                | curl -fsS -o /dev/null -H 'Content-Type: application/json' \
                    -H "Authorization: Bearer $token" --data-binary @- "$url/api/me/password"
              echo "admin password set from OpenBao"
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
