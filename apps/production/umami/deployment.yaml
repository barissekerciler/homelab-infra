apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
  labels:
    app: umami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umami
  template:
    metadata:
      labels:
        app: umami
    spec:
      containers:
        - name: umami
          image: ghcr.io/umami-software/umami:3.5.0 # {"$imagepolicy": "flux-system:umami"}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: umami-db
                  key: DATABASE_URL
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: umami-app
                  key: APP_SECRET
            # Block lists know script.js and /api/send.
            - name: TRACKER_SCRIPT_NAME
              value: p
            - name: COLLECT_API_ENDPOINT
              value: /api/e
            # Visits come through the Cloudflare tunnel.
            - name: CLIENT_IP_HEADER
              value: cf-connecting-ip
            - name: DISABLE_TELEMETRY
              value: "1"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
