# OpenBao role "app-secrets" may write only secret/umami/* for this namespace
# (apps/production/openbao/README.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-app-secrets
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-app-secrets
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: app-secrets
          serviceAccountRef:
            name: openbao-app-secrets
---
# 40 letters and digits: nothing to escape in JSON or a shell.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: app-secret
spec:
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# A new APP_SECRET signs everyone out and counts this month's visitors again.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: umami-app
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - kind: SecretStore
      name: openbao-app-secrets
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: app-secret
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: umami/umami-app
          property: APP_SECRET
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: umami-admin
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - kind: SecretStore
      name: openbao-app-secrets
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: app-secret
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: umami/umami-admin
          property: password
