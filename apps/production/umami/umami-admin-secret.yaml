# Values: OpenBao secret/umami/umami-admin (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: umami-admin
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: umami-admin
  data:
    - secretKey: password
      remoteRef:
        key: umami/umami-admin
        property: password
