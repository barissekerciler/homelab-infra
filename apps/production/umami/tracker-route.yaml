# On the blog's own host, so blocking the tracker blocks the blog. A route for
# the blog itself on this host takes priority 100: fixed numbers, so Traefik
# never ranks them by rule length.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: umami-tracker
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`blog.bariss.dev`) && (Path(`/p.js`) || Path(`/api/e`))
      priority: 200
      services:
        - name: umami
          port: 3000
