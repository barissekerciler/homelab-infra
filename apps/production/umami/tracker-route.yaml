# The blog's Pages Function proxies its /p and /api/e here, so visitors only
# ever see blog.bariss.dev.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: umami-tracker
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`umami.bariss.dev`) && (Path(`/p`) || Path(`/api/e`))
      services:
        - name: umami
          port: 3000
