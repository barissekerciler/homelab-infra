# On the blog's own host, so blocking the tracker blocks the blog; the paths
# avoid names block lists match. A route for the blog itself on this host
# takes priority 100: fixed numbers, so Traefik never ranks them by rule length.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: umami-tracker
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`blog.bariss.dev`) && Path(`/p.js`)
      priority: 200
      middlewares:
        - name: umami-script
      services:
        - name: umami
          port: 3000
    - kind: Rule
      match: Host(`blog.bariss.dev`) && Path(`/api/e`)
      priority: 200
      middlewares:
        - name: umami-collect
      services:
        - name: umami
          port: 3000
