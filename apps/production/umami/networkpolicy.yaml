# Umami's whole API answers on 3000, sign-in included, so only Traefik (the
# dashboard and the two tracker paths) and the admin password Job connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: umami
spec:
  podSelector:
    matchLabels:
      app: umami
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - podSelector:
            matchLabels:
              app: umami-admin-password
      ports:
        - protocol: TCP
          port: 3000
