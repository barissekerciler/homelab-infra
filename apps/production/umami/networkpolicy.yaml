# Umami's whole API answers on 3000, sign-in included.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: umami
spec:
  podSelector:
    matchLabels:
      app: umami
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3000
