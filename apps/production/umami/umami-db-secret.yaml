# Values: OpenBao secret/postgresql/umami-db (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: umami-db
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: umami-db
    template:
      mergePolicy: Merge
      data:
        DATABASE_URL: "postgresql://umami:{{ .password }}@postgres-rw.postgresql.svc.cluster.local:5432/umami"
  data:
    - secretKey: password
      remoteRef:
        key: postgresql/umami-db
        property: password
