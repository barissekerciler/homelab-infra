# Volumes of the agent workloads that the Claude Code box applies with kubectl
# (outside Git). Pinned here so a rebuilt cluster binds the same disks.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pvc-f37dc034-69aa-4ba3-98a9-db53292b119d
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    pv.kubernetes.io/provisioned-by: org.democratic-csi.iscsi
spec:
  capacity:
    storage: 150Gi
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: freenas-iscsi-csi
  mountOptions:
  - noatime
  csi:
    driver: org.democratic-csi.iscsi
    nodeStageSecretRef:
      name: node-stage-secret-freenas-iscsi-csi-democratic-csi-iscsi
      namespace: democratic-csi-iscsi
    fsType: ext4
    volumeAttributes:
      interface: ''
      iqn: iqn.2005-10.org.freenas.ctl:csi-pvc-f37dc034-69aa-4ba3-98a9-db53292b119d-cluster
      lun: '0'
      node_attach_driver: iscsi
      portal: 10.0.0.203:3260
      portals: ''
      provisioner_driver: freenas-api-iscsi
      provisioner_driver_instance_id: democratic-csi-iscsi
      storage.kubernetes.io/csiProvisionerIdentity: 1793119914870-4768-org.democratic-csi.iscsi
    volumeHandle: pvc-f37dc034-69aa-4ba3-98a9-db53292b119d
  claimRef:
    namespace: claude-agents
    name: goal-recorder-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: goal-recorder-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: freenas-iscsi-csi
  volumeName: pvc-f37dc034-69aa-4ba3-98a9-db53292b119d
  resources:
    requests:
      storage: 150Gi
