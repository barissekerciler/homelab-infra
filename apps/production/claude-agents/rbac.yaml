# Everything in this namespace for the box: pods, exec, Secrets, workloads,
# Services, Ingresses and Roles. admission.yaml stops it from changing the
# NetworkPolicy.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-code-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: claude-code
    namespace: claude-code
