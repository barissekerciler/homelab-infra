# Only the box drives the browser (MCP on 8931), and only Traefik, behind
# the GitHub sign-in, shows its screen (noVNC on 6080). Other pods in
# claude-agents cannot reach either.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: claude-browser
spec:
  podSelector:
    matchLabels:
      app: claude-browser
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: claude-code
          podSelector:
            matchLabels:
              app: claude-code
      ports:
        - protocol: TCP
          port: 8931
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 6080
