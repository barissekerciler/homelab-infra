# The /oauth2/ callback for this host is served by the oauth2-proxy ingress in
# infrastructure/oauth2-proxy/home-bariss-dev.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: claude-browser-auth
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy-home-bariss-dev.svc.cluster.local/
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claude-browser
  labels:
    app: claude-browser
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: claude-agents-claude-browser-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: agent-browser.home.bariss.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: claude-browser
                port:
                  number: 6080
