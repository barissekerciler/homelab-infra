apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rdt-ingress
  labels:
    app: rdt
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"

spec:
  ingressClassName: traefik
  rules:
    - host: rdt.home.bariss.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rdt
                port:
                  number: 6500
