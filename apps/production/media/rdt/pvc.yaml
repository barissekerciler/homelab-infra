apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: rdt-downloads-pvc
spec:
  storageClassName: freenas-nfs-csi
  volumeName: rdt-downloads-pv
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: rdt-config-pvc-iscsi
spec:
  volumeName: pvc-2c2b7dc6-d1b2-4fc1-9cdc-ebf754385e75
  storageClassName: freenas-iscsi-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
