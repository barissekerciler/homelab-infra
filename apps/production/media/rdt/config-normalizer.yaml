apiVersion: v1
kind: ConfigMap
metadata:
  name: rdt-config-normalizer
  labels:
    app: rdt
data:
  normalize-rdt.py: |
    #!/usr/bin/env python3
    import sqlite3
    from pathlib import Path

    DB = Path("/data/db/rdtclient.db")
    DEFAULTS = ["Gui", "Integrations", "Provider", "Watch"]
    # Release groups pack tiny .txt/.nfo/.url files into torrents. The internal
    # downloader can hang on them, leaving the torrent at "Downloading file
    # 130/130 (100%)" forever, and Sonarr/Radarr never import those files anyway.
    EXCLUDE_REGEX = r"(?i)\.(txt|nfo|url|exe|lnk|html?|jpe?g|png|gif|bmp)$"
    SETTINGS = {
        # 0 keeps a failed torrent in rdt, where Sonarr and Radarr see it in
        # the qBittorrent "error" state. A torrent that rdt deletes vanishes
        # from their queues without a failed event, so nothing blocklists
        # the release or searches again (sonarr-stalled-requeue does both).
        **{f"{default}:Default:DeleteOnError": "0" for default in DEFAULTS},
        **{f"{default}:Default:ExcludeRegex": EXCLUDE_REGEX for default in DEFAULTS},
    }

    if not DB.exists():
        print(f"{DB} does not exist yet; skipping RDT normalization")
        raise SystemExit(0)

    con = sqlite3.connect(DB, timeout=30)
    try:
        cur = con.cursor()
        for setting, value in SETTINGS.items():
            cur.execute(
                """
                insert into Settings (SettingId, Value)
                values (?, ?)
                on conflict(SettingId) do update set Value = excluded.Value
                """,
                (setting, value),
            )
        con.commit()
    finally:
        con.close()

    print(f"RDT config normalized: DeleteOnError and ExcludeRegex set for {len(DEFAULTS)} defaults")
