apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  labels:
    app: radarr
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # The SQLite config is on a ReadWriteOnce volume; never run two pods on it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      containers:
        - name: radarr
          image: linuxserver/radarr:latest@sha256:51a9ac2a9eb47afc833541e5fd6c11b86eb9f810694c22fa2429e3078e9194b2
          ports:
            - containerPort: 7878
              name: http
          startupProbe:
            httpGet:
              path: /ping
              port: http
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            failureThreshold: 6
            timeoutSeconds: 10
          env:
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            - name: TZ
              value: "Etc/UTC"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: content
              mountPath: /content
            - name: downloads
              mountPath: /downloads
          resources:
            requests:
              cpu: 30m
              memory: 192Mi
            limits:
              cpu: "1"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-iscsi-config-pvc
        - name: content
          persistentVolumeClaim:
            claimName: radarr-nfs-content-pvc
        - name: downloads
          persistentVolumeClaim:
            claimName: rdt-downloads-pvc
