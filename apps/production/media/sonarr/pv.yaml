apiVersion: v1
kind: PersistentVolume
metadata:
  name: sonarr-nfs-config-pv
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app: sonarr
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: freenas-nfs-csi
  nfs:
    server: 10.0.0.203
    path: /mnt/pool1/apps/media/sonarr
  mountOptions:
    - noatime
    - nfsvers=4.1
    - nconnect=4
---
