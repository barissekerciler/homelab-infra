apiVersion: batch/v1
kind: CronJob
metadata:
  name: sonarr-stalled-requeue
  labels:
    app: sonarr-stalled-requeue
    component: stalled-requeue
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 240
      backoffLimit: 0
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: sonarr-stalled-requeue
            component: stalled-requeue
        spec:
          restartPolicy: Never
          containers:
            - name: requeue
              image: python:3.15-alpine
              imagePullPolicy: IfNotPresent
              command:
                - python
                - /app/requeue.py
              env:
                - name: SONARR_URL
                  value: http://sonarr.media.svc.cluster.local:8989
                - name: RDT_URL
                  value: http://rdt.media.svc.cluster.local:6500
                - name: STALLED_MINUTES
                  value: "10"
                - name: MAX_PER_RUN
                  value: "3"
              envFrom:
                - secretRef:
                    name: sonarr-stalled-requeue-secret
              volumeMounts:
                - name: script
                  mountPath: /app/requeue.py
                  subPath: requeue.py
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                limits:
                  cpu: 200m
          volumes:
            - name: script
              configMap:
                name: sonarr-stalled-requeue-script
                defaultMode: 0555
