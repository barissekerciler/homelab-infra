apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  labels:
    app: sonarr
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # The SQLite config is on a ReadWriteOnce volume; never run two pods on it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
        - name: sonarr
          image: linuxserver/sonarr:latest@sha256:673dc4609a5672bc8e46069c86ffcea283a86b48d34a6c93d8da8c24a1b87571
          ports:
            - containerPort: 8989
              name: http
          startupProbe:
            httpGet:
              path: /ping
              port: http
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            failureThreshold: 6
            timeoutSeconds: 10
          env:
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            - name: TZ
              value: "Etc/UTC"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: content
              mountPath: /content
            - name: downloads
              mountPath: /downloads
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              cpu: "1"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-iscsi-config-pvc
        - name: content
          persistentVolumeClaim:
            claimName: sonarr-nfs-content-pvc
        - name: downloads
          persistentVolumeClaim:
            claimName: rdt-downloads-pvc
