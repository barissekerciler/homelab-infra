# Values: OpenBao secret/media/sonarr-stalled-requeue-secret (KV v2).
# RDT_USERNAME and RDT_PASSWORD are the login Sonarr's rdt download client uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr-stalled-requeue-secret
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: sonarr-stalled-requeue-secret
    template:
      metadata:
        labels:
          app: sonarr-stalled-requeue
      mergePolicy: Merge
  data:
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: media/sonarr-stalled-requeue-secret
        property: SONARR_API_KEY
    - secretKey: RDT_USERNAME
      remoteRef:
        key: media/sonarr-stalled-requeue-secret
        property: RDT_USERNAME
    - secretKey: RDT_PASSWORD
      remoteRef:
        key: media/sonarr-stalled-requeue-secret
        property: RDT_PASSWORD
