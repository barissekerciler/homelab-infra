apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  releaseName: jellyfin
  chart:
    spec:
      chart: jellyfin
      # https://github.com/jellyfin/jellyfin-helm/blob/jellyfin-3.7.0/charts/jellyfin/values.yaml
      version: 3.7.0
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: flux-system
  interval: 1h0m0s
  # The 750 MB image pull can take longer than the default five-minute Helm
  # wait on homelab2.
  timeout: 15m0s
  values:
    image:
      repository: ghcr.io/jellyfin/jellyfin
      tag: 12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    # One writer for the SQLite database on the RWO volume.
    deploymentStrategy:
      type: Recreate
    # Restarts Jellyfin when system.xml changes in Git.
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    # The server settings (system.xml beside this file) come from Git: every
    # start copies them over the config volume's copy, so a setting changed in
    # the dashboard returns to Git's value at the next restart.
    extraInitContainers:
      - name: copy-system-xml
        image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        command:
          - sh
          - -c
          - mkdir -p /config/config && cp /git/system.xml /config/config/system.xml
        volumeMounts:
          - name: config
            mountPath: /config
          - name: system-xml
            mountPath: /git
            readOnly: true
        resources:
          requests:
            cpu: 10m
          limits:
            cpu: 100m
    # TrueNAS's apps user (568) owns the library files. 993 is homelab's render
    # group.
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
      supplementalGroups:
        - 993
    jellyfin:
      env:
        - name: TZ
          value: Europe/Berlin
        - name: JELLYFIN_PublishedServerUrl
          value: watch.home.bariss.dev
        - name: JELLYFIN_CACHE_DIR
          value: /cache
    persistence:
      config:
        existingClaim: jellyfin-config
      cache:
        enabled: true
        existingClaim: jellyfin-cache
      media:
        enabled: false
    # The TrueNAS library paths, so the database's item paths stay valid.
    volumes:
      - name: sonarr
        persistentVolumeClaim:
          claimName: sonarr-nfs-content-pvc
      - name: radarr
        persistentVolumeClaim:
          claimName: radarr-nfs-content-pvc
      - name: transcodes
        emptyDir: {}
      - name: system-xml
        configMap:
          name: jellyfin-system-xml
      - name: dispatcharr-recordings
        persistentVolumeClaim:
          claimName: dispatcharr-recordings-pvc
          readOnly: true
    volumeMounts:
      - name: sonarr
        mountPath: /sonarr
      - name: radarr
        mountPath: /radarr
      - name: dispatcharr-recordings
        mountPath: /recordings
        readOnly: true
      # One transcodes volume at both paths, as in the TrueNAS app's layout.
      - name: transcodes
        mountPath: /config/transcodes
      - name: transcodes
        mountPath: /cache/transcodes
    # homelab and homelab2 have an i5-6500 iGPU (no 10-bit HEVC or AV1
    # decoding), homelab3 an i5-7500T (10-bit HEVC, no AV1). Jellyfin's
    # hardware decoding settings follow the i5-6500, so they hold on any node.
    resources:
      requests:
        cpu: 5m
        memory: 384Mi
        gpu.intel.com/i915: "1"
      limits:
        cpu: "2"
        memory: 4Gi
        gpu.intel.com/i915: "1"
