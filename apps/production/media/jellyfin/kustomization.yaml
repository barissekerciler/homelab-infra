apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  kustomize.toolkit.fluxcd.io/prune: disabled
resources:
  - pv.yaml
  - pvc.yaml
  - release.yaml
  - ingress.yaml
configMapGenerator:
  - name: jellyfin-system-xml
    files:
      - system.xml
    options:
      disableNameSuffixHash: true
