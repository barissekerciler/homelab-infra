apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpackerr
  labels:
    app: unpackerr
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unpackerr
  template:
    metadata:
      labels:
        app: unpackerr
    spec:
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
      containers:
        - name: unpackerr
          image: golift/unpackerr:1.0.1@sha256:fc8b69571033f197d4db5cf22a573acb3bb891c9f8033431b9a1fcf679ca3e9c
          env:
            - name: TZ
              value: Etc/UTC
            - name: UN_DEBUG
              value: "false"
            - name: UN_INTERVAL
              value: 30s
            - name: UN_START_DELAY
              value: 30s
            - name: UN_RETRY_DELAY
              value: 10m
            - name: UN_MAX_RETRIES
              value: "3"
            - name: UN_PARALLEL
              value: "1"
            - name: UN_FILE_MODE
              value: "0664"
            - name: UN_DIR_MODE
              value: "0775"
            - name: UN_LOG_QUEUES
              value: 5m
            # v1 starts a web UI on 0.0.0.0:5656 by default and logs a
            # generated admin password. Keep it off: Sonarr and Radarr are
            # set here, and there is no /config volume for the UI to save to.
            - name: UN_WEBSERVER_LISTEN_ADDR
              value: ""
            - name: UN_SONARR_0_URL
              value: http://sonarr.media.svc.cluster.local:8989
            - name: UN_SONARR_0_PATHS_0
              value: /downloads
            - name: UN_SONARR_0_PROTOCOLS
              value: torrent,TorrentDownloadProtocol
            - name: UN_SONARR_0_TIMEOUT
              value: 2m
            - name: UN_SONARR_0_DELETE_DELAY
              value: 10m
            - name: UN_SONARR_0_DELETE_ORIG
              value: "false"
            - name: UN_RADARR_0_URL
              value: http://radarr.media.svc.cluster.local:7878
            - name: UN_RADARR_0_PATHS_0
              value: /downloads
            - name: UN_RADARR_0_PROTOCOLS
              value: torrent,TorrentDownloadProtocol
            - name: UN_RADARR_0_TIMEOUT
              value: 2m
            - name: UN_RADARR_0_DELETE_DELAY
              value: 10m
            - name: UN_RADARR_0_DELETE_ORIG
              value: "false"
          envFrom:
            - secretRef:
                name: unpackerr-secret
          volumeMounts:
            - name: downloads
              mountPath: /downloads
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 4Gi
      volumes:
        - name: downloads
          persistentVolumeClaim:
            claimName: rdt-downloads-pvc
