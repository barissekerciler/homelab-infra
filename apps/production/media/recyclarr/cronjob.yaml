apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  labels:
    app: recyclarr
spec:
  schedule: "30 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: recyclarr
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: recyclarr
              image: ghcr.io/recyclarr/recyclarr:8.8.1@sha256:3e9c41b9ec29bbf65fe846864058730d321a21f7695d8c0d9437b73e34d50ad9
              args:
                - sync
              env:
                - name: TZ
                  value: Etc/UTC
              envFrom:
                - secretRef:
                    name: recyclarr-secret
              volumeMounts:
                # Recyclarr clones the TRaSH guides and keeps its state here;
                # sync adopts existing formats by name, so a fresh dir is fine.
                - name: data
                  mountPath: /config
                - name: config
                  mountPath: /config/recyclarr.yml
                  subPath: recyclarr.yml
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 128Mi
                limits:
                  cpu: 500m
          volumes:
            - name: data
              emptyDir: {}
            - name: config
              configMap:
                name: recyclarr-config
