# Values: OpenBao secret/media/recyclarr-secret (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recyclarr-secret
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: recyclarr-secret
    template:
      metadata:
        labels:
          app: recyclarr
      mergePolicy: Merge
  data:
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: media/recyclarr-secret
        property: RADARR_API_KEY
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: media/recyclarr-secret
        property: SONARR_API_KEY
