apiVersion: v1
kind: PersistentVolume
metadata:
  name: bazarr-nfs-config-pv
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app: bazarr
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: freenas-nfs-csi
  nfs:
    server: 10.0.0.203
    path: /mnt/pool1/apps/media/bazarr
  mountOptions:
    - noatime
    - nfsvers=4.1
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pvc-160e088b-072a-4f5d-b272-68e0088aa2bc
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    pv.kubernetes.io/provisioned-by: org.democratic-csi.iscsi
spec:
  capacity:
    storage: 10Gi
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: freenas-iscsi-csi
  mountOptions:
  - noatime
  csi:
    driver: org.democratic-csi.iscsi
    nodeStageSecretRef:
      name: node-stage-secret-freenas-iscsi-csi-democratic-csi-iscsi
      namespace: democratic-csi-iscsi
    fsType: ext4
    volumeAttributes:
      interface: ''
      iqn: iqn.2005-10.org.freenas.ctl:csi-pvc-160e088b-072a-4f5d-b272-68e0088aa2bc-cluster
      lun: '0'
      node_attach_driver: iscsi
      portal: 10.0.0.203:3260
      portals: ''
      provisioner_driver: freenas-api-iscsi
      provisioner_driver_instance_id: democratic-csi-iscsi
      storage.kubernetes.io/csiProvisionerIdentity: 1792021530188-8148-org.democratic-csi.iscsi
    volumeHandle: pvc-160e088b-072a-4f5d-b272-68e0088aa2bc
  claimRef:
    namespace: media
    name: bazarr-iscsi-config-pvc
