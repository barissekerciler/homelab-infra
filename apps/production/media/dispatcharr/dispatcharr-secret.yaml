# Values: OpenBao secret/media/dispatcharr-secret (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dispatcharr-secret
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: dispatcharr-secret
  data:
    - secretKey: DJANGO_SECRET_KEY
      remoteRef:
        key: media/dispatcharr-secret
        property: DJANGO_SECRET_KEY
