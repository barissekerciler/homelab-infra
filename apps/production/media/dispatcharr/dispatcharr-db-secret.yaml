# Values: OpenBao secret/postgresql/dispatcharr-db (KV v2).
# Role dispatcharr's password on the cluster's PostgreSQL (POSTGRES_PASSWORD),
# generated once into OpenBao (apps/base/postgresql/passwords.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dispatcharr-db
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: dispatcharr-db
  data:
    - secretKey: password
      remoteRef:
        key: postgresql/dispatcharr-db
        property: password
