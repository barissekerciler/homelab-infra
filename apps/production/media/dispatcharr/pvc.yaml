apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dispatcharr-recordings-pvc
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  volumeName: pvc-aa9956af-361d-4c92-bdde-42cf226f3a44
  storageClassName: freenas-nfs-csi
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
