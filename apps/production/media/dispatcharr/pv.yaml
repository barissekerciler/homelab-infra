      provisioner_driver: freenas-api-iscsi
      provisioner_driver_instance_id: democratic-csi-iscsi
      storage.kubernetes.io/csiProvisionerIdentity: 1792318885743-1551-org.democratic-csi.iscsi
    volumeHandle: pvc-6e1d2acb-5525-4536-a506-a9b2434b05bf
  claimRef:
    namespace: media
    name: dispatcharr-data-pvc
