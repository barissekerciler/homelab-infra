# Volumes provisioned by the cluster, written down so a rebuilt
# cluster binds each one to the same claim.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pvc-aa9956af-361d-4c92-bdde-42cf226f3a44
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    pv.kubernetes.io/provisioned-by: org.democratic-csi.nfs
spec:
  capacity:
    storage: 100Gi
  accessModes:
  - ReadWriteMany
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: freenas-nfs-csi
  mountOptions:
  - noatime
  - nfsvers=4.1
  csi:
    driver: org.democratic-csi.nfs
    fsType: nfs
    volumeAttributes:
      node_attach_driver: nfs
      provisioner_driver: freenas-api-nfs
      provisioner_driver_instance_id: democratic-csi-nfs
      server: 10.0.0.203
      share: /mnt/pool1/k8s/zfs/nfs/pvc-aa9956af-361d-4c92-bdde-42cf226f3a44
      storage.kubernetes.io/csiProvisionerIdentity: 1790948200046-4021-org.democratic-csi.nfs
    volumeHandle: pvc-aa9956af-361d-4c92-bdde-42cf226f3a44
  claimRef:
    namespace: media
    name: dispatcharr-recordings-pvc
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pvc-6e1d2acb-5525-4536-a506-a9b2434b05bf
