# Values: OpenBao secret/frigate/frigate-secrets (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-secrets
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: frigate-secrets
  data:
    - secretKey: FRIGATE_MQTT_PASSWORD
      remoteRef:
        key: frigate/frigate-secrets
        property: FRIGATE_MQTT_PASSWORD
    - secretKey: FRIGATE_RESTREAM_PASSWORD
      remoteRef:
        key: frigate/frigate-secrets
        property: FRIGATE_RESTREAM_PASSWORD
    - secretKey: FRIGATE_RESTREAM_USER
      remoteRef:
        key: frigate/frigate-secrets
        property: FRIGATE_RESTREAM_USER
    - secretKey: FRIGATE_RTSP_PASSWORD
      remoteRef:
        key: frigate/frigate-secrets
        property: FRIGATE_RTSP_PASSWORD
    - secretKey: FRIGATE_RTSP_USER
      remoteRef:
        key: frigate/frigate-secrets
        property: FRIGATE_RTSP_USER
