apiVersion: v1
kind: Service
metadata:
  name: frigate
  labels:
    app: frigate
spec:
  selector:
    app: frigate
  ports:
    - name: http
      port: 8971
      targetPort: 8971
---
apiVersion: v1
kind: Service
metadata:
  name: frigate-nas-mirror
  labels:
    app: frigate-nas-mirror
spec:
  selector:
    app: frigate-nas-mirror
  ports:
    - name: webdav
      port: 8080
      targetPort: 8080
