# Values: OpenBao secret/frigate/frigate-uploader-secrets (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-uploader-secrets
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: frigate-uploader-secrets
  data:
    - secretKey: RCLONE_CONFIG_CRYPT_PASSWORD
      remoteRef:
        key: frigate/frigate-uploader-secrets
        property: RCLONE_CONFIG_CRYPT_PASSWORD
    - secretKey: RCLONE_CONFIG_CRYPT_PASSWORD2
      remoteRef:
        key: frigate/frigate-uploader-secrets
        property: RCLONE_CONFIG_CRYPT_PASSWORD2
    - secretKey: RCLONE_CONFIG_HETZNER_KEY_PEM
      remoteRef:
        key: frigate/frigate-uploader-secrets
        property: RCLONE_CONFIG_HETZNER_KEY_PEM
    # The Storage Box sub-account: <box>-sub1.your-storagebox.de and <box>-sub1.
    - secretKey: RCLONE_CONFIG_HETZNER_HOST
      remoteRef:
        key: frigate/frigate-uploader-secrets
        property: RCLONE_CONFIG_HETZNER_HOST
    - secretKey: RCLONE_CONFIG_HETZNER_USER
      remoteRef:
        key: frigate/frigate-uploader-secrets
        property: RCLONE_CONFIG_HETZNER_USER
