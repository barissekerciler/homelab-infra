# Frigate takes the signed-in user from X-Auth-Request-User (config proxy.header_map).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: frigate-auth
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy-home-bariss-dev.svc.cluster.local/
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
