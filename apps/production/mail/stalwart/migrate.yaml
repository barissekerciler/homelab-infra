# Temporary: stalwart-migrate copies Stalwart v0.16 (database stalwart) into a
# v1 store (database stalwart_v1). The pod only sleeps; the commands run in it
# with kubectl exec (prepare needs a terminal). Its state lives in an emptyDir,
# so copy /var/lib/stalwart-migrate out before removing this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalwart-migrate
  labels:
    app: stalwart-migrate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stalwart-migrate
  template:
    metadata:
      labels:
        app: stalwart-migrate
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: stalwartlabs/stalwart-migrate:1.0.7@sha256:368725b2d5e0ff2ea673e51d5c39cddc7cc8bfbc6c88cb46b9d627039862f27b
          command:
            - sleep
            - infinity
          # The same environment as the Stalwart server, so references to
          # environment variables in its settings resolve.
          env:
            - name: STALWART_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-db
                  key: password
            - name: STALWART_CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stalwart-secret
                  key: cloudflare-api-token
            - name: STALWART_RECOVERY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: stalwart-secret
                  key: recovery-admin
            - name: STALWART_PUBLIC_URL
              value: https://stalwart.home.bariss.dev
            - name: STALWART_HOSTNAME
              value: mx.bariss.dev
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 2000
          volumeMounts:
            - name: source-config
              mountPath: /etc/stalwart/config.json
              subPath: config.json
              readOnly: true
            - name: target-config
              mountPath: /etc/stalwart-v1/config.json
              subPath: config.json
              readOnly: true
            - name: state
              mountPath: /var/lib/stalwart-migrate
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: source-config
          configMap:
            name: stalwart-config
        - name: target-config
          configMap:
            name: stalwart-config-v1
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
