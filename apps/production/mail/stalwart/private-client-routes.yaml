apiVersion: traefik.io/v1alpha1
kind: ServersTransportTCP
metadata:
  name: stalwart-tls
spec:
  tls:
    serverName: mx.bariss.dev
    insecureSkipVerify: false
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: stalwart-clients
spec:
  minVersion: VersionTLS12
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: stalwart-imap-clients
spec:
  minVersion: VersionTLS12
  alpnProtocols:
    - imap
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: stalwart-submissions
spec:
  entryPoints:
    - submissions
  routes:
    - match: HostSNI(`mx.home.bariss.dev`)
      services:
        - name: stalwart
          port: 465
          tls: true
          serversTransport: stalwart-tls
  tls:
    options:
      name: stalwart-clients
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: stalwart-imaps
spec:
  entryPoints:
    - imaps
  routes:
    - match: HostSNI(`mx.home.bariss.dev`)
      services:
        - name: stalwart
          port: 993
          tls: true
          serversTransport: stalwart-tls
  tls:
    options:
      name: stalwart-imap-clients
