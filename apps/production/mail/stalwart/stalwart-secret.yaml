# Values: OpenBao secret/mail/stalwart-secret (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-secret
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: stalwart-secret
  data:
    - secretKey: cloudflare-api-token
      remoteRef:
        key: mail/stalwart-secret
        property: cloudflare-api-token
    - secretKey: recovery-admin
      remoteRef:
        key: mail/stalwart-secret
        property: recovery-admin
    - secretKey: recovery-password
      remoteRef:
        key: mail/stalwart-secret
        property: recovery-password
    - secretKey: wireguard-private-key
      remoteRef:
        key: mail/stalwart-secret
        property: wireguard-private-key
