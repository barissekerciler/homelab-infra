apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-config
data:
  config.json: |
    {
      "@type": "PostgreSql",
      "host": "postgres-rw.postgresql.svc.cluster.local",
      "port": 5432,
      "database": "stalwart_v1",
      "authUsername": "stalwart",
      "authSecret": {
        "@type": "EnvironmentVariable",
        "variableName": "STALWART_DB_PASSWORD"
      }
    }
