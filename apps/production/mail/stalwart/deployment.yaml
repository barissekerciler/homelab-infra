apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalwart
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app: stalwart
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stalwart
  template:
    metadata:
      labels:
        app: stalwart
    spec:
      # The mail server (infrastructure/priority-classes).
      priorityClassName: homelab-critical
      automountServiceAccountToken: false
      hostname: stalwart
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wireguard
          image: lscr.io/linuxserver/wireguard:1.0.20260223-r0-ls126
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              ip link delete wg0 2>/dev/null || true
              ip link add wg0 type wireguard
              ip address add 172.16.6.2/30 dev wg0
              ip address add 185.182.51.25/32 dev wg0
              wg set wg0 \
                private-key /run/mail-secrets/wireguard-private-key \
                peer cvg3cSk4ZdVKhmlW+cayse4vcsvcLsYItGhdEVvb7nI= \
                endpoint 185.182.51.2:36075 \
                allowed-ips 0.0.0.0/0 \
                persistent-keepalive 25
              ip link set mtu 1420 up dev wg0
              ip route add default dev wg0 table 252
              ip rule del from 185.182.51.25/32 table 252 priority 100 2>/dev/null || true
              ip rule del fwmark 25 table 252 priority 101 2>/dev/null || true
              ip rule del fwmark 25 prohibit priority 102 2>/dev/null || true
              ip rule add from 185.182.51.25/32 table 252 priority 100
              ip rule add fwmark 25 table 252 priority 101
              ip rule add fwmark 25 prohibit priority 102
              while iptables -t mangle -D OUTPUT -p tcp --dport 25 -j MARK --set-mark 25 2>/dev/null; do :; done
              while iptables -t nat -D POSTROUTING -o wg0 -p tcp --dport 25 -j SNAT --to-source 185.182.51.25 2>/dev/null; do :; done
              while ip6tables -D OUTPUT -p tcp --dport 25 -j REJECT 2>/dev/null; do :; done
              iptables -t mangle -A OUTPUT -p tcp --dport 25 -j MARK --set-mark 25
              iptables -t nat -A POSTROUTING -o wg0 -p tcp --dport 25 -j SNAT --to-source 185.182.51.25
              ip6tables -A OUTPUT -p tcp --dport 25 -j REJECT
              iptables -N STALWART_WG_INPUT 2>/dev/null || iptables -F STALWART_WG_INPUT
              while iptables -D INPUT -i wg0 -j STALWART_WG_INPUT 2>/dev/null; do :; done
              iptables -A INPUT -i wg0 -j STALWART_WG_INPUT
              iptables -A STALWART_WG_INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
              iptables -A STALWART_WG_INPUT -p tcp --dport 25 -j ACCEPT
              iptables -A STALWART_WG_INPUT -j DROP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: stalwart-secret
              mountPath: /run/mail-secrets
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      containers:
        - name: stalwart
          image: stalwartlabs/stalwart:v1.1.0@sha256:f772aa6ef8cd8018969fa491640f1436b0270eb14e2c219b5f37f1a77020837e
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/stalwart/config.json
          env:
            - name: STALWART_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-db
                  key: password
            - name: STALWART_CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stalwart-secret
                  key: cloudflare-api-token
            - name: STALWART_RECOVERY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: stalwart-secret
                  key: recovery-admin
            - name: STALWART_PUBLIC_URL
              value: https://stalwart.home.bariss.dev
            - name: STALWART_HOSTNAME
              value: mx.bariss.dev
          ports:
            - name: smtp
              containerPort: 25
              protocol: TCP
            - name: submissions
              containerPort: 465
              protocol: TCP
            - name: imaps
              containerPort: 993
              protocol: TCP
            - name: sieve
              containerPort: 4190
              protocol: TCP
            - name: management
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz/live
              port: management
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: management
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 2000
          volumeMounts:
            - name: stalwart-config
              mountPath: /etc/stalwart/config.json
              subPath: config.json
              readOnly: true
            - name: stalwart-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: stalwart-config
          configMap:
            name: stalwart-config
        - name: stalwart-secret
          secret:
            secretName: stalwart-secret
        - name: stalwart-tmp
          emptyDir: {}
