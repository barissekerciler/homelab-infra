# Values: OpenBao secret/postgresql/roundcube-db (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: roundcube-db
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: roundcube-db
  data:
    - secretKey: password
      remoteRef:
        key: postgresql/roundcube-db
        property: password
