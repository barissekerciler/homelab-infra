apiVersion: v1
kind: ConfigMap
metadata:
  name: roundcube-config
data:
  zzz-stalwart.php: |
    <?php
    $config['smtp_user'] = '%u';
    $config['smtp_pass'] = '%p';
    $config['imap_conn_options'] = [
      'ssl' => [
        'verify_peer' => true,
        'verify_peer_name' => true,
        'peer_name' => 'mx.bariss.dev',
      ],
    ];
    $config['smtp_conn_options'] = [
      'ssl' => [
        'verify_peer' => true,
        'verify_peer_name' => true,
        'peer_name' => 'mx.bariss.dev',
      ],
    ];
    $config['managesieve_host'] = 'tls://stalwart:4190';
    $config['managesieve_conn_options'] = [
      'ssl' => [
        'verify_peer' => true,
        'verify_peer_name' => true,
        'peer_name' => 'mx.bariss.dev',
      ],
    ];
    $config['enable_installer'] = false;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roundcube
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app: roundcube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: roundcube
  template:
    metadata:
      annotations:
        mail.home.bariss.dev/credentials-revision: "2"
      labels:
        app: roundcube
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: roundcube
          image: roundcube/roundcubemail:1.7.6-apache-nonroot@sha256:6f3d54d5275bd843852bd2c7628988faa05d5c6ec33529a6fc9744ef20596c87
          imagePullPolicy: IfNotPresent
          env:
            - name: ROUNDCUBEMAIL_DEFAULT_HOST
              value: ssl://stalwart
            - name: ROUNDCUBEMAIL_DEFAULT_PORT
              value: "993"
            - name: ROUNDCUBEMAIL_SMTP_SERVER
              value: ssl://stalwart
            - name: ROUNDCUBEMAIL_SMTP_PORT
              value: "465"
            - name: ROUNDCUBEMAIL_PLUGINS
              value: archive,zipdownload,managesieve
            - name: ROUNDCUBEMAIL_DB_TYPE
              value: pgsql
            - name: ROUNDCUBEMAIL_DB_HOST
              value: postgres-rw.postgresql.svc.cluster.local
            - name: ROUNDCUBEMAIL_DB_PORT
              value: "5432"
            - name: ROUNDCUBEMAIL_DB_USER
              value: roundcube
            - name: ROUNDCUBEMAIL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: roundcube-db
                  key: password
            - name: ROUNDCUBEMAIL_DB_NAME
              value: roundcube
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 33
            runAsNonRoot: true
            runAsUser: 33
          volumeMounts:
            - name: roundcube-config
              mountPath: /var/roundcube/config/zzz-stalwart.php
              subPath: zzz-stalwart.php
              readOnly: true
            - name: roundcube-secret
              mountPath: /run/secrets
              readOnly: true
            - name: roundcube-tmp
              mountPath: /tmp/roundcube-temp
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: roundcube-config
          configMap:
            name: roundcube-config
        - name: roundcube-secret
          secret:
            secretName: roundcube-secret
            items:
              - key: des-key
                path: roundcube_des_key
        - name: roundcube-tmp
          emptyDir: {}
