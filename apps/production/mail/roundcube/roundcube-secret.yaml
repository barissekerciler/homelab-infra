# Values: OpenBao secret/mail/roundcube-secret (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: roundcube-secret
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: roundcube-secret
  data:
    - secretKey: des-key
      remoteRef:
        key: mail/roundcube-secret
        property: des-key
