# OpenBao, the official chart: one server on integrated raft storage, data on
# the pinned iSCSI volume data-openbao-0 (volumes.yaml). One replica, because
# raft quorum on two nodes is no better than one; the pod moves with its iSCSI
# volume when a node goes away.
#
# The static seal unseals it after every restart from the 32-byte key in the
# Secret openbao-seal, which is created by hand and never in Git, like Flux's
# deploy key (README.md). The UI is https://openbao.home.bariss.dev (LAN and
# Tailscale only) behind the GitHub sign-in; the CLI goes through
# `kubectl port-forward`.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
spec:
  releaseName: openbao
  chart:
    spec:
      chart: openbao
      # https://github.com/openbao/openbao-helm/blob/openbao-0.30.7/charts/openbao/values.yaml
      version: 0.30.7
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: flux-system
  interval: 1h0m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # The chart's snapshot CronJob has no TTL; finished runs leave after an hour.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: CronJob
              name: openbao-snapshot
            patch: |
              - op: add
                path: /spec/jobTemplate/spec/ttlSecondsAfterFinished
                value: 3600
  values:
    injector:
      enabled: false
    server:
      # The chart default (OnDelete) would leave a chart bump waiting for a
      # manual pod delete; the static seal unseals the new pod by itself.
      updateStrategyType: RollingUpdate
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 512Mi
      readinessProbe:
        # Ready when unsealed, and before the first `bao operator init`;
        # a sealed server stays unready.
        path: /v1/sys/health?standbyok=true&uninitcode=204
      dataStorage:
        size: 2Gi
        storageClass: freenas-iscsi-csi
      extraVolumes:
        # Mounted at /openbao/userconfig/openbao-seal/; 0440 for the
        # openbao group (fsGroup 1000).
        - type: secret
          name: openbao-seal
          defaultMode: 288
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.middlewares: openbao-openbao-auth@kubernetescrd
        hosts:
          - host: openbao.home.bariss.dev
            paths: []
      ha:
        enabled: true
        replicas: 1
        # The default budget for one replica allows no eviction, which
        # would block node drains (tuppr upgrades).
        disruptionBudget:
          enabled: false
        raft:
          enabled: true
          setNodeId: true
          config: |
            ui = true

            listener "tcp" {
              tls_disable = 1
              address = "[::]:8200"
              cluster_address = "[::]:8201"
            }

            storage "raft" {
              path = "/openbao/data"
            }

            # A new key gets a new id; rotation keeps the old one as
            # previous_key until storage is re-encrypted (README.md).
            seal "static" {
              current_key_id = "20261106-1"
              current_key = "file:///openbao/userconfig/openbao-seal/key"
            }

            service_registration "kubernetes" {}
    # The chart's snapshot agent: a CronJob that saves a raft snapshot and
    # uploads it with s3cmd to the bucket openbao-snapshots on SeaweedFS, a
    # TrueNAS app (truenas/apps/seaweedfs), then deletes uploads older than
    # 14 days.
    # It signs in with its ServiceAccount openbao-snapshot (auth/kubernetes,
    # role "snapshot": read on sys/storage/raft/snapshot only). A snapshot
    # holds barrier-encrypted data: a restore needs the seal key (README.md).
    snapshotAgent:
      enabled: true
      # UTC, the chart sets no timeZone: 00:05 in Berlin in winter, 01:05 in
      # summer.
      schedule: "5 23 * * *"
      # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY for that bucket only
      # (openbao-snapshots-s3-secret.yaml).
      s3CredentialsSecret: openbao-snapshots-s3
      config:
        s3Host: 10.0.0.203:8333
        s3Bucket: openbao-snapshots
        s3Uri: s3://openbao-snapshots
        s3ExpireDays: "14"
        # Plain HTTP on the LAN.
        s3cmdExtraFlag: --no-ssl
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 256Mi
