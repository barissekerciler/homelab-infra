# The raft data volume (iSCSI), claimed by the chart StatefulSet's
# volumeClaimTemplate "data" as data-openbao-0. Snapshots go to SeaweedFS
# (release.yaml).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pvc-8224397f-f73e-475b-a7b4-f4bd120bd6f2
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    pv.kubernetes.io/provisioned-by: org.democratic-csi.iscsi
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: freenas-iscsi-csi
  mountOptions:
    - noatime
  csi:
    driver: org.democratic-csi.iscsi
    nodeStageSecretRef:
      name: node-stage-secret-freenas-iscsi-csi-democratic-csi-iscsi
      namespace: democratic-csi-iscsi
    fsType: ext4
    volumeAttributes:
      interface: ''
      iqn: iqn.2005-10.org.freenas.ctl:csi-pvc-8224397f-f73e-475b-a7b4-f4bd120bd6f2-cluster
      lun: '0'
      node_attach_driver: iscsi
      portal: 10.0.0.203:3260
      portals: ''
      provisioner_driver: freenas-api-iscsi
      provisioner_driver_instance_id: democratic-csi-iscsi
      storage.kubernetes.io/csiProvisionerIdentity: 1793991042590-8940-org.democratic-csi.iscsi
    volumeHandle: pvc-8224397f-f73e-475b-a7b4-f4bd120bd6f2
  claimRef:
    namespace: openbao
    name: data-openbao-0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-openbao-0
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  volumeName: pvc-8224397f-f73e-475b-a7b4-f4bd120bd6f2
  storageClassName: freenas-iscsi-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
