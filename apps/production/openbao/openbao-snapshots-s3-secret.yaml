# Values: OpenBao secret/shared/openbao-snapshots-s3 (KV v2).
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY: the SeaweedFS S3 key for the
# bucket openbao-snapshots only, for the chart's snapshot agent
# (release.yaml). SeaweedFS's identities file on the NAS holds the same value
# (truenas/apps/seaweedfs).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-snapshots-s3
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: openbao-snapshots-s3
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: shared/openbao-snapshots-s3
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: shared/openbao-snapshots-s3
        property: AWS_SECRET_ACCESS_KEY
