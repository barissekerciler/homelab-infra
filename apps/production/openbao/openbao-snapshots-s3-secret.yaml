# Values: OpenBao secret/shared/openbao-snapshots-s3 (KV v2).
# SeaweedFS's identities file on the NAS holds the same key (truenas/apps/seaweedfs).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-snapshots-s3
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: openbao-snapshots-s3
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: shared/openbao-snapshots-s3
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: shared/openbao-snapshots-s3
        property: AWS_SECRET_ACCESS_KEY
