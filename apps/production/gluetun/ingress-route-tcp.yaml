apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: gluetun-proxy
  labels:
    app: gluetun
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`proxy.home.bariss.dev`)
      services:
        - name: gluetun
          port: 8888
  tls:
    options:
      name: gluetun-proxy
