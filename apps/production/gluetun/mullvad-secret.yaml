# Values: OpenBao secret/gluetun/mullvad-secret (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mullvad-secret
  namespace: gluetun
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: mullvad-secret
  data:
    - secretKey: DNS_ADDRESS
      remoteRef:
        key: gluetun/mullvad-secret
        property: DNS_ADDRESS
    - secretKey: FIREWALL_OUTBOUND_SUBNETS
      remoteRef:
        key: gluetun/mullvad-secret
        property: FIREWALL_OUTBOUND_SUBNETS
    - secretKey: SERVER_COUNTRIES
      remoteRef:
        key: gluetun/mullvad-secret
        property: SERVER_COUNTRIES
    - secretKey: WIREGUARD_ADDRESSES
      remoteRef:
        key: gluetun/mullvad-secret
        property: WIREGUARD_ADDRESSES
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef:
        key: gluetun/mullvad-secret
        property: WIREGUARD_PRIVATE_KEY
