# Remote Control reconnects the box's sessions only when it restarts within
# about four hours. Memory requests on both nodes are nearly full, so after a
# drain the box would wait for the other node; with this class the scheduler
# evicts a lower-priority pod there instead. Cluster-scoped.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: claude-code
value: 100000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: The Claude Code box beats other homelab workloads.
