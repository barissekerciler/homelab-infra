# Remote Control reconnects the box's sessions only when it restarts within
# about four hours. When no node has room for the box (a node down or
# drained), the scheduler evicts a lower-priority pod instead of leaving it
# Pending; same value as homelab-critical (infrastructure/priority-classes).
# Cluster-scoped.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: claude-code
value: 100000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: The Claude Code box beats other homelab workloads.
