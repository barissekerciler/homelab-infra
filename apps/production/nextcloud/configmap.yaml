apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-config
data:
  install-packages.sh: |
    #!/bin/sh
    # The TrueNAS app built its image with these apt packages.
    set -eu
    apt-get update -o APT::Update::Error-Mode=any
    apt-get install -y --no-install-recommends ffmpeg ocrmypdf libreoffice
    rm -rf /var/lib/apt/lists/*
    exec "$@"
  occ: |
    #!/bin/bash
    uid="$(id -u)"
    gid="$(id -g)"
    if [ "$uid" = "0" ]; then
      user='www-data'
      group='www-data'
    else
      user="$uid"
      group="$gid"
    fi
    run_as() {
      if [ "$(id -u)" = "0" ]; then
        su -p "$user" -s /bin/bash -c "php /var/www/html/occ $(printf '%q ' "$@")"
      else
        /bin/bash -c "php /var/www/html/occ $(printf '%q ' "$@")"
      fi
    }
    run_as "$@"
  limitrequestbody.conf: |
    LimitRequestBody 107374182400
