# Values: OpenBao secret/nextcloud/nextcloud-env (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-env
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nextcloud-env
  data:
    - secretKey: REDIS_HOST_PASSWORD
      remoteRef:
        key: nextcloud/nextcloud-env
        property: REDIS_HOST_PASSWORD
