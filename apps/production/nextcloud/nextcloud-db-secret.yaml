# Values: OpenBao secret/postgresql/nextcloud-db (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-db
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nextcloud-db
    template:
      mergePolicy: Merge
      data:
        username: nextcloud
  data:
    - secretKey: password
      remoteRef:
        key: postgresql/nextcloud-db
        property: password
