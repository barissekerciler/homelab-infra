# The official Vikunja chart (bjw-s common library; values sit under
# `vikunja:`). Tasks live in the cluster PostgreSQL, files on
# the pinned iSCSI volume. The ingress takes the wildcard certificate from
# Traefik's default TLSStore.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vikunja
spec:
  releaseName: vikunja
  chart:
    spec:
      chart: vikunja
      version: 2.5.0
      sourceRef:
        kind: HelmRepository
        name: vikunja
        namespace: flux-system
  interval: 1h0m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    vikunja:
      image:
        repository: vikunja/vikunja
        tag: 2.7.1
      controller:
        annotations:
          reloader.stakater.com/auto: "true"
      persistence:
        data:
          enabled: true
          existingClaim: vikunja-files
          mountPath: /app/vikunja/files
        # SQLite only.
        database:
          enabled: false
      ingress:
        main:
          enabled: true
          ingressClassName: traefik
          annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: null
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
          hosts:
            - host: vik.home.bariss.dev
              paths:
                - path: /
      configMaps:
        config:
          enabled: true
          data:
            config.yml: |
              service:
                publicurl: https://vik.home.bariss.dev/
                timezone: Europe/Berlin
                # Vikunja's default lets anyone who reaches it sign up.
                enableregistration: false
      env:
        VIKUNJA_DATABASE_TYPE: postgres
        VIKUNJA_DATABASE_HOST: postgres-rw.postgresql.svc.cluster.local
        VIKUNJA_DATABASE_DATABASE: vikunja
        VIKUNJA_DATABASE_USER: vikunja
        VIKUNJA_DATABASE_PASSWORD:
          valueFrom:
            secretKeyRef:
              name: vikunja-db
              key: password
        # Signs the login tokens; without it every restart logs everyone out.
        VIKUNJA_SERVICE_SECRET:
          valueFrom:
            secretKeyRef:
              name: vikunja-env
              key: VIKUNJA_SERVICE_SECRET
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
