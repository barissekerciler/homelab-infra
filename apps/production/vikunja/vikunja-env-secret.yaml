# Values: OpenBao secret/vikunja/vikunja-env (KV v2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja-env
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: vikunja-env
  data:
    - secretKey: VIKUNJA_SERVICE_SECRET
      remoteRef:
        key: vikunja/vikunja-env
        property: VIKUNJA_SERVICE_SECRET
