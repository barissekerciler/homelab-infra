# Values: OpenBao secret/postgresql/vikunja-db (KV v2).
# Role vikunja's password on the cluster's PostgreSQL (VIKUNJA_DATABASE_PASSWORD),
# generated once into OpenBao (apps/base/postgresql/passwords.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja-db
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: vikunja-db
  data:
    - secretKey: password
      remoteRef:
        key: postgresql/vikunja-db
        property: password
