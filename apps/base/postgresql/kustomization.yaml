apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: postgresql
# What both PostgreSQL clusters share, applied once by its own Flux
# Kustomization `postgresql` (clusters/homelab/apps.yaml), before prod and dev:
# the namespace, the role password store, the superuser and the metrics scrape.
# The Cluster both overlays build on is cluster/; apps/production/postgresql
# makes it the main cluster `postgres` (backed up), apps/dev/postgresql the
# pantry `postgres-pantry`. Runbook: apps/production/postgresql/README.md.
resources:
  - namespace.yaml
  - passwords.yaml
  - superuser.yaml
  - postgres-superuser-secret.yaml
  - monitoring.yaml

components:
  - ../../../infrastructure/goldilocks/namespace-defaults
