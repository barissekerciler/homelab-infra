apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgresql-passwords
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-passwords
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: postgresql-passwords
          serviceAccountRef:
            name: postgresql-passwords
---
# 40 letters and digits: no character needs escaping in a connection URL.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: role-password
spec:
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
