# Role passwords: nobody types one. For each role a PushSecret takes a fresh
# password from the generator below and writes it to OpenBao, at
# secret/postgresql/<role>-db, only if that key does not exist yet
# (updatePolicy IfNotExists). An ExternalSecret <role>-db reads it back here
# (the DatabaseRole's passwordSecret) and one in the app's namespace.
#
# The PushSecrets write through this namespace's own SecretStore, signed in
# as the ServiceAccount below: OpenBao role "postgresql-passwords", whose
# policy may create and read secret/postgresql/* and nothing else
# (README.md). The ClusterSecretStore "openbao" stays read-only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgresql-passwords
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-passwords
spec:
  provider:
    vault:
      server: http://openbao-active.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: postgresql-passwords
          serviceAccountRef:
            name: postgresql-passwords
---
# 40 letters and digits: no character needs escaping in a connection URL.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: role-password
spec:
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
