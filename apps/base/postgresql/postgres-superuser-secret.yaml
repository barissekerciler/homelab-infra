# Values: OpenBao secret/postgresql/postgres-superuser (KV v2).
# The superuser's password (cluster.yaml superuserSecret), generated once by
# the PushSecret in superuser.yaml. The nightly dumps use it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-superuser
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: postgres-superuser
    template:
      type: kubernetes.io/basic-auth
      mergePolicy: Merge
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: postgres
  data:
    - secretKey: password
      remoteRef:
        key: postgresql/postgres-superuser
        property: password
