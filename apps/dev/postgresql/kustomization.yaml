apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: postgresql
# The pantry, the PostgreSQL cluster that is not backed up
# (apps/production/postgresql/README.md). What both clusters share (namespace,
# password store, superuser, metrics) is apps/base/postgresql, applied before
# this by its own Flux Kustomization.
resources:
  - ../../base/postgresql/cluster
patches:
  - path: cluster.yaml
    target:
      kind: Cluster
      name: postgres
    options:
      allowNameChange: true
